name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Synchronize a channel, resume a verified draft, or recover original alpha.2 assets
        required: true
        type: choice
        default: sync-dual-channel
        options: [sync-published-channel, resume-verified-draft, sync-dual-channel, resume-dual-draft, resume-existing-alpha2, publish-mygo-installer]
      tag:
        description: Original version tag for channel synchronization or verified draft recovery
        required: false
        type: string
      release-run-id:
        description: Original tag-triggered Release run ID for synchronization or draft recovery
        required: false
        type: string
      release-run-attempt:
        description: Exact original Release attempt for synchronization or draft recovery
        required: false
        type: string
        default: '1'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DZC_BUILD_REVISION: ${{ github.sha }}

concurrency:
  group: release-updater-channels
  queue: max
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub release
    if: github.event_name == 'push' || inputs.mode == 'resume-existing-alpha2'
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id || steps.recovery.outputs.release_id }}
      prerelease: ${{ steps.release.outputs.prerelease || steps.recovery.outputs.prerelease }}
      source: ${{ steps.recovery.outputs.source || github.sha }}
      tooling_source: ${{ github.sha }}
      tag: ${{ steps.recovery.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require signed updater configuration
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/updater-release.mjs preflight "$GITHUB_REF_NAME"

      - name: Require synchronized source versions matching the release tag
        if: github.event_name == 'push'
        run: node scripts/set-release-version.mjs --check "$GITHUB_REF_NAME"

      - name: Verify updater release logic
        run: node --test scripts/tests/set-release-version.node.mjs scripts/tests/updater-release.node.mjs scripts/tests/release-windows-upgrade.node.mjs

      - name: Resolve the fixed original release for recovery
        if: github.event_name == 'workflow_dispatch'
        id: recovery
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_RECOVERY: '1'
          DZC_RELEASE_TOOLING_SOURCE: ${{ github.sha }}
          DZC_RECOVERY_OPERATION: ${{ inputs.mode }}
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from release_recovery import authority
          from release_identities import VERSION, expected_assets, require
          from release_identity_inputs import InputFailure, metadata, safe_message
          source = '037f40cf014cd4bb3dce4a0a0c5cbcaee23affae'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-recovery-context.json'
          report = {'schema_version': 1, 'kind': 'recovery_preflight', 'status': 'failed', 'stage': 'authority'}
          try:
              require(os.environ['DZC_RECOVERY_OPERATION'] == 'resume-existing-alpha2', 'Only the fixed alpha.2 recovery is supported')
              report['authority'] = authority(source)
              report['stage'] = 'release_metadata'
              release, report['request'] = metadata('repos/qiyuanhuakai/dezirclip/releases/422045565', os.environ['GH_TOKEN'])
              report['stage'] = 'asset_catalog'
              require(release['id'] == 422045565 and release['tag_name'] == 'v0.2.0-alpha.2' and release['draft'] is True and release['prerelease'] is True, 'Original unpublished alpha.2 release required')
              names = []
              for target in ('windows-x86_64', 'windows-aarch64', 'linux-x86_64', 'linux-aarch64'):
                  archive, packages = expected_assets(target)
                  names += [archive, archive + '.sha256', *packages]
                  names += [name + '.sig' for name in packages if name.endswith(('.exe', '.AppImage', '.deb'))]
              require(VERSION == '0.2.0-alpha.2' and len(names) == len(set(names)) == 24, 'Original complete asset catalog required')
              actual = [asset['name'] for asset in release['assets']]
              require(len(actual) == len(set(actual)) == 24 and set(actual) == set(names), 'All original 24 assets must already exist; recovery never rebuilds or replaces assets')
              require(all(asset['state'] == 'uploaded' and asset['size'] > 0 for asset in release['assets']), 'Original asset uploads must be complete')
              report.update(status='passed', stage='complete', release_id=release['id'], assets=[{key: asset[key] for key in ('name', 'id', 'size', 'updated_at', 'digest')} for asset in release['assets']])
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('release_id=422045565\nprerelease=true\nsource=' + source + '\ntag=v0.2.0-alpha.2\n')
          except BaseException as error:
              report['status'] = 'failed'
              report['error_type'] = type(error).__name__
              report['error'] = error.details if isinstance(error, InputFailure) else {'category': 'RecoveryContextRejected', 'message': safe_message(str(error), os.environ.get('GH_TOKEN', ''))}
              raise
          finally:
              with output.open('x', encoding='utf-8') as stream:
                  json.dump(report, stream, indent=2)
                  stream.flush()
                  os.fsync(stream.fileno())

      - name: Retain the actual recovery context
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-context-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-recovery-context.json
          if-no-files-found: error

      - name: Create or reuse release
        if: github.event_name == 'push'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          release_args=()
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            prerelease=true
            release_args+=(--prerelease --latest=false)
          fi
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          source_notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$source_notes" ]]; then
            release_notes="$RUNNER_TEMP/dezirclip-release-notes.md"
            node -e 'const fs=require("node:fs"); const base=`https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.GITHUB_REF_NAME}`; fs.writeFileSync(process.argv[2], fs.readFileSync(process.argv[1], "utf8").replaceAll("](../specs/", `](${base}/docs/specs/`));' "$source_notes" "$release_notes"
            notes_args=(--notes-file "$release_notes")
          else
            notes_args=(--notes "Native dzc includes pick, TUI, Shell initialization and read-only MCP. Download the matching DezirClip installer or standalone dzc archive for your platform; SHA-256 checksums accompany standalone archives.")
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "DezirClip ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${release_args[@]}" \
              "${notes_args[@]}"
          fi
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" = true
          release_id="$(gh release view "${GITHUB_REF_NAME}" --json databaseId --jq '.databaseId')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build-standalone-cli:
    name: Build compatible standalone CLI
    if: github.event_name == 'push'
    uses: ./.github/workflows/standalone-cli.yml
    with:
      artifact-prefix: release-cli
      version: ${{ github.ref_name }}
      package-only: true

  accept-source:
    name: Source acceptance
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      full_validation: false
      source_acceptance: true

  publish-standalone-cli:
    name: Publish verified standalone archives
    if: github.event_name == 'push'
    needs: [create-release, build-standalone-cli]
    runs-on: ubuntu-24.04
    steps:
      - name: Download independently built CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-cli-*
          path: artifacts/dzc
          merge-multiple: true

      - name: Verify all four archives and checksums are present
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            archive="artifacts/dzc/dzc-${version}-${platform}.${extension}"
            test -s "$archive"
            test -s "${archive}.sha256"
            (cd artifacts/dzc && sha256sum --check "$(basename "${archive}.sha256")")
          done

      - name: Upload CLI archives and checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/dzc/* --clobber

  publish-desktop:
    name: Dual desktop release (${{ matrix.name }})
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-24.04
            msvc_arch: ''
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            platform: ubuntu-24.04-arm
            msvc_arch: ''
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            platform: windows-latest
            msvc_arch: ''
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            platform: windows-latest
            msvc_arch: amd64_arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            pkg-config libpipewire-0.3-dev libgbm-dev libx11-dev libxi-dev libxrandr-dev
            libxtst-dev libdbus-1-dev xdg-utils squashfs-tools)
          options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${options[@]}" update -qq
          sudo apt-get "${options[@]}" install -y --no-install-recommends "${packages[@]}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify Cargo helper ownership and bundle configuration
        run: node scripts/check-desktop-companions.mjs

      - name: Setup MSVC ARM64 toolchain
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            clients/go/go.sum
            frontends/dzc-surface/go.sum

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-thin-lto-${{ matrix.name }}

      - name: Cache Linux packaging tools
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-bundle-tools-2.12.3-${{ runner.arch }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Tauri executable and MyGo Native
        id: desktop
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          pnpm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:TARGET_TRIPLE -eq 'x86_64-unknown-linux-gnu') {
            if (!(Test-Path /usr/bin/google-chrome)) {
              pnpm exec playwright install chromium --only-shell
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            node scripts/tests/verify-desktop-web.mjs
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          node scripts/prepare-tauri-sidecars.mjs --with-desktop --release --phase bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run desktop:mygo:build --target "$env:TARGET_TRIPLE"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $buildRoot = Join-Path $metadata.target_directory $env:TARGET_TRIPLE
          "directory=$(Join-Path $buildRoot 'release')" >> $env:GITHUB_OUTPUT
          "sidecars=$(Join-Path $buildRoot 'release')" >> $env:GITHUB_OUTPUT

      - name: Bundle and sign Tauri using the standalone sidecars
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundle = @('exec', 'tauri', 'bundle', '--ci', '--target', $env:TARGET_TRIPLE,
                      '--features', 'tauri/custom-protocol', '--config', 'src-tauri/tauri.sidecars.json', '--bundles')
          $override = Join-Path $env:RUNNER_TEMP 'release-bundle.json'
          $config = @{ build = @{ beforeBundleCommand = $null } }
          if ($IsWindows) {
            $config.bundle = @{ windows = @{ nsis = @{ compression = 'zlib' } } }
            $bundle += 'nsis'
          } else {
            $bundle += 'deb,appimage'
          }
          Set-Content -LiteralPath $override -Value ($config | ConvertTo-Json -Depth 6 -Compress) -Encoding utf8
          $bundle += @('--config', $override)
          pnpm @bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package MyGo Native and the Tauri RPM
        id: additional-bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MYGO_TARGET: ${{ matrix.target }}
          MYGO_PLATFORM: ${{ matrix.name }}
          SIDECARS: ${{ steps.desktop.outputs.sidecars }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            node scripts/bundle-rpm.mjs --receipt "$RUNNER_TEMP/rpm-bundle.json" --reuse-sidecars &
            rpm_pid=$!
          fi
          result=0
          python scripts/bundle-mygo.py --target "$MYGO_PLATFORM" --sidecars "$SIDECARS" \
            --native "artifacts/dzc-desktop/$MYGO_TARGET" --output "$RUNNER_TEMP/mygo-release" \
            --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --smoke || result=$?
          if [[ -n "${rpm_pid:-}" ]]; then
            wait "$rpm_pid" || result=$?
          fi
          if (( result != 0 )); then exit "$result"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            rpm_path="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).artifact);' "$RUNNER_TEMP/rpm-bundle.json")"
            test -s "$rpm_path"
            echo "rpm=$rpm_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Arch Linux packages and AUR recipes
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          BUNDLE_ROOT: ${{ steps.desktop.outputs.directory }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          install -d "$RUNNER_TEMP/arch-release"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/scripts/bundle-archlinux.sh:/bundle.sh:ro" \
            --volume "$BUNDLE_ROOT/bundle/deb:/tauri:ro" \
            --volume "$RUNNER_TEMP/mygo-release:/mygo:ro" \
            --volume "$RUNNER_TEMP/arch-release:/output" \
            archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91 \
            bash /bundle.sh "$GITHUB_REF_NAME" "/tauri/DezirClip_${version}_amd64.deb" \
            "/mygo/DezirClip-MyGo_${version}_amd64.deb" /output

      - name: Stage both desktop variants with provenance
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.name }}
          BUNDLE_ROOT: ${{ steps.desktop.outputs.directory }}
          TAURI_RPM: ${{ steps.additional-bundles.outputs.rpm }}
        run: |
          $formats = if ($IsWindows) { @('nsis') } else { @('deb', 'appimage') }
          $files = @(foreach ($format in $formats) {
            Get-ChildItem -LiteralPath (Join-Path $env:BUNDLE_ROOT "bundle/$format") -File |
              Where-Object Extension -In '.exe', '.deb', '.AppImage', '.sig' |
              Select-Object -ExpandProperty FullName
          })
          if ($env:TAURI_RPM) { $files += $env:TAURI_RPM }
          $files += @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'mygo-release') -File |
            Select-Object -ExpandProperty FullName)
          $archPackages = Join-Path $env:RUNNER_TEMP 'arch-release'
          if (Test-Path -LiteralPath $archPackages) {
            $files += @(Get-ChildItem -LiteralPath $archPackages -File | Select-Object -ExpandProperty FullName)
          }
          node scripts/updater-release.mjs stage-desktop "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA" "$env:PLATFORM" "$env:RUNNER_TEMP/desktop-candidate" @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload the signed desktop build for verification
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-candidate/
          if-no-files-found: error
          compression-level: 0

  upload-desktop:
    name: Upload verified desktop assets
    if: github.event_name == 'push'
    needs: [create-release, publish-desktop]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-desktop-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-candidates
      - name: Attach staged desktop bytes and read back their asset IDs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs attach-desktop "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/desktop-candidates" "$RELEASE_ID" > "$RUNNER_TEMP/desktop-readback.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-desktop-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-readback.json
          if-no-files-found: error

  collect-release-identities:
    name: Collect actual final package identities
    needs: create-release
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resume-existing-alpha2'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-identities.yml
    with:
      source: ${{ needs.create-release.outputs.source }}
      tooling-source: ${{ needs.create-release.outputs.tooling_source }}
      recovery: ${{ github.event_name == 'workflow_dispatch' }}
      release-id: ${{ needs.create-release.outputs.release_id }}

  verify-final-windows-upgrade:
    name: Verify actual signed Windows upgrades
    needs: create-release
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resume-existing-alpha2'
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows-upgrade.yml
    with:
      source: ${{ needs.create-release.outputs.source }}
      tooling-source: ${{ needs.create-release.outputs.tooling_source }}
      recovery: ${{ github.event_name == 'workflow_dispatch' }}
      release-id: ${{ needs.create-release.outputs.release_id }}

  verify-publish-and-promote:
    name: Verify signed artifacts, publish and synchronize update channel
    if: github.event_name == 'push'
    needs: [create-release, upload-desktop, publish-standalone-cli, accept-source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the source acceptance receipt from this attempt
        uses: actions/download-artifact@v4
        with:
          name: source-acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-source
      - name: Require the tested source to match the release candidate
        shell: python
        env:
          ACCEPTED_SOURCE: ${{ needs.accept-source.outputs.accepted_source }}
          RELEASE_SOURCE: ${{ needs.create-release.outputs.source }}
        run: |
          import json, os
          from pathlib import Path
          receipt = json.loads((Path(os.environ["RUNNER_TEMP"]) / "candidate-source/source-acceptance.json").read_text(encoding="utf-8"))
          source = os.environ["GITHUB_SHA"]
          if (source != os.environ["ACCEPTED_SOURCE"] or source != os.environ["RELEASE_SOURCE"]
                  or receipt["source_revision"] != source or receipt["mode"] != "source-acceptance"
                  or receipt["schema_version"] != 1 or receipt["run_id"] != int(os.environ["GITHUB_RUN_ID"])
                  or receipt["run_attempt"] != int(os.environ["GITHUB_RUN_ATTEMPT"])
                  or receipt["desktop_targets"] != ["linux-x86_64", "windows-x86_64"]
                  or receipt["jobs"] != {name: "success" for name in ("frontend", "rust-development", "go-development", "ci-desktop-plan", "tauri")}):
              raise SystemExit("Source acceptance receipt does not attest the candidate")
      - name: Verify both desktops and activate the update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs publish-dual "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee "$RUNNER_TEMP/updater-channel-sync.json"
      - uses: actions/upload-artifact@v4
        with:
          name: updater-channel-sync-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/updater-channel-sync.json
          if-no-files-found: error
      - name: Record the first-attempt release time
        if: github.run_attempt == '1'
        shell: bash
        run: |
          node --input-type=module - "$RUNNER_TEMP/updater-channel-sync.json" <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { workflow } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const elapsed = Math.round((Date.now() - Date.parse(workflow.run_started_at)) / 1000);
          if (Number.isFinite(elapsed) && elapsed >= 0) {
            const minutes = (elapsed / 60).toFixed(1);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Release timing\nFirst attempt: **${minutes} minutes** from workflow start to channel publication. Target: **15–20 minutes**.\n`);
          }
          JS

  publish-historical-recovery:
    name: Publish the fixed historical recovery
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'resume-existing-alpha2'
    needs: [create-release, collect-release-identities, verify-final-windows-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish the fixed historical recovery
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
        run: node scripts/updater-release.mjs publish-only "$DZC_RELEASE_TAG"

  recover-dual-release:
    name: Resume dual-desktop publication or synchronize its channel
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'sync-dual-channel' || inputs.mode == 'resume-dual-draft')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the original dual-desktop jobs and synchronize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN: ${{ inputs.release-run-id }}
          RELEASE_ATTEMPT: ${{ inputs.release-run-attempt }}
        run: node scripts/updater-release.mjs "$RELEASE_MODE" "$RELEASE_TAG" "$RELEASE_RUN" "$RELEASE_ATTEMPT"

  sync-published-channel:
    name: Resume verified publication or synchronize update channel
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'sync-published-channel' || inputs.mode == 'resume-verified-draft')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require reviewed synchronization tooling
        run: test "$GITHUB_REF" = refs/heads/master

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate the original successful Windows upgrade aggregate artifact
        id: upgrade-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_TAG: ${{ inputs.tag }}
          DZC_RELEASE_RUN_ID: ${{ inputs.release-run-id }}
          DZC_RELEASE_RUN_ATTEMPT: ${{ inputs.release-run-attempt }}
        run: node scripts/release-upgrade-artifact.mjs "$DZC_RELEASE_RUN_ID" "$DZC_RELEASE_RUN_ATTEMPT" "$DZC_RELEASE_TAG" "$RUNNER_TEMP/updater-upgrade-artifact.json"

      - name: Download the original release upgrade gate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release-run-id }}
          artifact-ids: ${{ steps.upgrade-artifact.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/updater-release-gates

      - name: Verify the original release gates and publish or synchronize without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_TAG: ${{ inputs.tag }}
          DZC_RELEASE_RUN_ID: ${{ inputs.release-run-id }}
          DZC_RELEASE_RUN_ATTEMPT: ${{ inputs.release-run-attempt }}
          DZC_PUBLICATION_MODE: ${{ inputs.mode == 'resume-verified-draft' && 'resume-verified-draft' || 'sync-published' }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs "$DZC_PUBLICATION_MODE" "$DZC_RELEASE_TAG" "$DZC_RELEASE_RUN_ID" "$DZC_RELEASE_RUN_ATTEMPT" "$RUNNER_TEMP/updater-release-gates/windows-upgrade.json" | tee "$RUNNER_TEMP/updater-channel-sync.json"

      - name: Retain the synchronization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-channel-backfill-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/updater-channel-sync.json
            ${{ runner.temp }}/updater-upgrade-artifact.json
          if-no-files-found: error

  publish-mygo-installer:
    name: Supplement published MyGo installer
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-mygo-installer'
    runs-on: windows-latest
    steps:
      - name: Require merged packaging tooling
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') { throw 'Run this mode from master' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Prepare immutable released MyGo payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/package-published-mygo.py --output "${{ runner.temp }}/mygo-installer-input"
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-mygo-installer.py --stage "$env:RUNNER_TEMP/mygo-installer-input/stage" --version 0.2.0-alpha.9 --output "$env:RUNNER_TEMP/DezirClip-v0.2.0-alpha.9-windows-x64-MyGo-setup.exe"
      - name: Verify installation, installed desktop, upgrade, locked files and uninstall
        run: python scripts/tests/mygo-installer-windows.py --stage "${{ runner.temp }}/mygo-installer-input/stage" --installer "${{ runner.temp }}/DezirClip-v0.2.0-alpha.9-windows-x64-MyGo-setup.exe" --legacy-close-after-paste
      - name: Attach tested installer without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $release = gh release view v0.2.0-alpha.9 --repo "$env:GITHUB_REPOSITORY" --json databaseId,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -or $release.isDraft -or $release.databaseId -ne 438668292) { throw 'Release changed' }
          gh release upload v0.2.0-alpha.9 "$env:RUNNER_TEMP/DezirClip-v0.2.0-alpha.9-windows-x64-MyGo-setup.exe" --repo "$env:GITHUB_REPOSITORY"
