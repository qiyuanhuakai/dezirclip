name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Resume original alpha.2 assets without rebuilding or moving its tag
        required: true
        type: choice
        options: [resume-existing-alpha2]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DZC_BUILD_REVISION: ${{ github.sha }}

concurrency:
  group: release-updater-channels
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id || steps.recovery.outputs.release_id }}
      prerelease: ${{ steps.release.outputs.prerelease || steps.recovery.outputs.prerelease }}
      source: ${{ steps.recovery.outputs.source || github.sha }}
      tooling_source: ${{ github.sha }}
      tag: ${{ steps.recovery.outputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require signed updater configuration
        if: github.event_name == 'push'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/updater-release.mjs preflight "$GITHUB_REF_NAME"

      - name: Verify updater release logic
        run: node --test scripts/tests/updater-release.node.mjs scripts/tests/release-windows-upgrade.node.mjs

      - name: Resolve the fixed original release for recovery
        if: github.event_name == 'workflow_dispatch'
        id: recovery
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_RECOVERY: '1'
          DZC_RELEASE_TOOLING_SOURCE: ${{ github.sha }}
          DZC_RECOVERY_OPERATION: ${{ inputs.mode }}
        run: |
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          from release_recovery import authority
          from release_identities import VERSION, expected_assets, require
          from release_identity_inputs import InputFailure, metadata, safe_message
          source = '037f40cf014cd4bb3dce4a0a0c5cbcaee23affae'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-recovery-context.json'
          report = {'schema_version': 1, 'kind': 'recovery_preflight', 'status': 'failed', 'stage': 'authority'}
          try:
              require(os.environ['DZC_RECOVERY_OPERATION'] == 'resume-existing-alpha2', 'Only the fixed alpha.2 recovery is supported')
              report['authority'] = authority(source)
              report['stage'] = 'release_metadata'
              release, report['request'] = metadata('repos/qiyuanhuakai/dezirclip/releases/422045565', os.environ['GH_TOKEN'])
              report['stage'] = 'asset_catalog'
              require(release['id'] == 422045565 and release['tag_name'] == 'v0.2.0-alpha.2' and release['draft'] is True and release['prerelease'] is True, 'Original unpublished alpha.2 release required')
              names = []
              for target in ('windows-x86_64', 'windows-aarch64', 'linux-x86_64', 'linux-aarch64'):
                  archive, packages = expected_assets(target)
                  names += [archive, archive + '.sha256', *packages]
                  names += [name + '.sig' for name in packages if name.endswith(('.exe', '.AppImage', '.deb'))]
              require(VERSION == '0.2.0-alpha.2' and len(names) == len(set(names)) == 24, 'Original complete asset catalog required')
              actual = [asset['name'] for asset in release['assets']]
              require(len(actual) == len(set(actual)) == 24 and set(actual) == set(names), 'All original 24 assets must already exist; recovery never rebuilds or replaces assets')
              require(all(asset['state'] == 'uploaded' and asset['size'] > 0 for asset in release['assets']), 'Original asset uploads must be complete')
              report.update(status='passed', stage='complete', release_id=release['id'], assets=[{key: asset[key] for key in ('name', 'id', 'size', 'updated_at', 'digest')} for asset in release['assets']])
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
                  stream.write('release_id=422045565\nprerelease=true\nsource=' + source + '\ntag=v0.2.0-alpha.2\n')
          except BaseException as error:
              report['status'] = 'failed'
              report['error_type'] = type(error).__name__
              report['error'] = error.details if isinstance(error, InputFailure) else {'category': 'RecoveryContextRejected', 'message': safe_message(str(error), os.environ.get('GH_TOKEN', ''))}
              raise
          finally:
              with output.open('x', encoding='utf-8') as stream:
                  json.dump(report, stream, indent=2)
                  stream.flush()
                  os.fsync(stream.fileno())

      - name: Retain the actual recovery context
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-recovery-context-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-recovery-context.json
          if-no-files-found: error

      - name: Create or reuse release
        if: github.event_name == 'push'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=false
          release_args=()
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            prerelease=true
            release_args+=(--prerelease --latest=false)
          fi
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          source_notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$source_notes" ]]; then
            release_notes="$RUNNER_TEMP/dezirclip-release-notes.md"
            node -e 'const fs=require("node:fs"); const base=`https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.GITHUB_REF_NAME}`; fs.writeFileSync(process.argv[2], fs.readFileSync(process.argv[1], "utf8").replaceAll("](../specs/", `](${base}/docs/specs/`));' "$source_notes" "$release_notes"
            notes_args=(--notes-file "$release_notes")
          else
            notes_args=(--notes "Native dzc includes pick, TUI, Shell initialization and read-only MCP. Download the matching DezirClip installer or standalone dzc archive for your platform; SHA-256 checksums accompany standalone archives.")
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "DezirClip ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${release_args[@]}" \
              "${notes_args[@]}"
          fi
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" = true
          release_id="$(gh release view "${GITHUB_REF_NAME}" --json databaseId --jq '.databaseId')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build-standalone-cli:
    name: Build compatible standalone CLI
    if: github.event_name == 'push'
    needs: create-release
    uses: ./.github/workflows/standalone-cli.yml
    with:
      version: ${{ github.ref_name }}

  publish-standalone-cli:
    name: Publish verified standalone archives
    if: github.event_name == 'push'
    needs: [create-release, build-standalone-cli]
    runs-on: ubuntu-24.04
    steps:
      - name: Download independently built CLI archives
        uses: actions/download-artifact@v4
        with:
          pattern: dzc-*
          path: artifacts/dzc
          merge-multiple: true

      - name: Verify all four archives and checksums are present
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for platform in linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64; do
            extension=tar.gz
            if [[ "$platform" == windows-* ]]; then extension=zip; fi
            archive="artifacts/dzc/dzc-${version}-${platform}.${extension}"
            test -s "$archive"
            test -s "${archive}.sha256"
            (cd artifacts/dzc && sha256sum --check "$(basename "${archive}.sha256")")
          done

      - name: Upload CLI archives and checksums to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" artifacts/dzc/* --clobber

  publish-tauri:
    name: Tauri release (${{ matrix.name }})
    if: github.event_name == 'push'
    needs: create-release
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-24.04
            args: ''
            rust_target: ''
            msvc_arch: ''
            can_run_dzc: true
          - name: linux-aarch64
            platform: ubuntu-24.04-arm
            args: ''
            rust_target: ''
            msvc_arch: ''
            can_run_dzc: true
          - name: windows-x86_64
            platform: windows-latest
            args: ''
            rust_target: ''
            msvc_arch: ''
            can_run_dzc: true
          - name: windows-aarch64
            platform: windows-latest
            args: --target aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            can_run_dzc: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check src-tauri/src/bin layout
        run: node scripts/check-tauri-bin-dir.mjs

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libpipewire-0.3-dev \
            libgbm-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxtst-dev \
            libdbus-1-dev \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        if: matrix.rust_target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup MSVC ARM64 toolchain
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        run: pnpm run release:set-version ${{ github.ref_name }}

      - name: Publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: DezirClip ${{ github.ref_name }}
          releaseBody: Native dzc includes pick, TUI, Shell initialization and read-only MCP. Download the matching DezirClip installer or standalone dzc archive for your platform; SHA-256 checksums accompany standalone archives.
          releaseDraft: true
          includeUpdaterJson: false
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

      - name: Bundle and upload RPM with pre-release package ordering
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          node scripts/bundle-rpm.mjs --receipt "$RUNNER_TEMP/rpm-bundle.json"
          rpm_path="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).artifact);' "$RUNNER_TEMP/rpm-bundle.json")"
          test -s "$rpm_path"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${{ needs.create-release.outputs.release_id }}" --jq '.draft')" = true
          gh release upload "$GITHUB_REF_NAME" "$rpm_path" --clobber

  publish-flatpak:
    name: Verified Flatpak release
    if: github.event_name == 'push'
    needs: create-release
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  collect-release-identities:
    name: Collect actual final package identities
    needs: [create-release, publish-tauri, publish-standalone-cli, publish-flatpak]
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.publish-tauri.result == 'success' && needs.publish-standalone-cli.result == 'success' && needs.publish-flatpak.result == 'success')) }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-identities.yml
    with:
      source: ${{ needs.create-release.outputs.source }}
      tooling-source: ${{ needs.create-release.outputs.tooling_source }}
      recovery: ${{ github.event_name == 'workflow_dispatch' }}
      release-id: ${{ needs.create-release.outputs.release_id }}

  verify-final-windows-upgrade:
    name: Verify actual signed Windows upgrades
    needs: [create-release, publish-tauri]
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.publish-tauri.result == 'success') }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-windows-upgrade.yml
    with:
      source: ${{ needs.create-release.outputs.source }}
      tooling-source: ${{ needs.create-release.outputs.tooling_source }}
      recovery: ${{ github.event_name == 'workflow_dispatch' }}
      release-id: ${{ needs.create-release.outputs.release_id }}

  verify-publish-and-promote:
    name: Verify signed artifacts and publish before public acceptance
    needs: [create-release, publish-tauri, publish-standalone-cli, publish-flatpak, collect-release-identities, verify-final-windows-upgrade]
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && needs.collect-release-identities.result == 'success' && needs.verify-final-windows-upgrade.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.publish-tauri.result == 'success' && needs.publish-standalone-cli.result == 'success' && needs.publish-flatpak.result == 'success')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tooling_source }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify all four signed updater artifacts before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/updater-release.mjs publish-only "${{ needs.create-release.outputs.tag }}"
