name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify candidate source, replay published acceptance, recover a release, or synchronize a channel
        required: true
        type: choice
        default: sync-dual-channel
        options: [verify-source-candidate, replay-windows-candidate, replay-linux-runtime, sync-published-channel, resume-verified-draft, sync-dual-channel, resume-dual-draft]
      tag:
        description: Original version tag for channel synchronization or verified draft recovery
        required: false
        type: string
      release-run-id:
        description: Original tag-triggered Release run ID for synchronization or draft recovery
        required: false
        type: string
      release-run-attempt:
        description: Exact original Release attempt for synchronization or draft recovery
        required: false
        type: string
        default: '1'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DZC_ARCH_BUILDER_IMAGE: archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91
  DZC_BUILD_REVISION: ${{ github.sha }}

concurrency:
  group: ${{ (inputs.mode == 'verify-source-candidate' || startsWith(inputs.mode || '', 'replay-')) && format('release-{0}-{1}', inputs.mode, github.ref) || 'release-updater-channels' }}
  queue: max
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      source: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require signed updater configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/updater-release.mjs preflight "$GITHUB_REF_NAME"

      - name: Require synchronized source versions matching the release tag
        run: node scripts/set-release-version.mjs --check "$GITHUB_REF_NAME"

      - name: Verify updater release logic
        run: node --test scripts/tests/set-release-version.node.mjs scripts/tests/updater-release.node.mjs scripts/tests/release-windows-upgrade.node.mjs

      - name: Create or reuse release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          source_notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$source_notes" ]]; then
            release_notes="$RUNNER_TEMP/dezirclip-release-notes.md"
            node -e 'const fs=require("node:fs"); const base=`https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.GITHUB_REF_NAME}`; fs.writeFileSync(process.argv[2], fs.readFileSync(process.argv[1], "utf8").replaceAll("](../specs/", `](${base}/docs/specs/`));' "$source_notes" "$release_notes"
            notes_args=(--notes-file "$release_notes")
          else
            notes_args=(--notes "Native dzc includes pick, TUI, Shell initialization and read-only MCP. Download the matching DezirClip installer or standalone dzc archive for your platform; SHA-256 checksums accompany standalone archives.")
          fi
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --title "DezirClip ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${release_args[@]}" \
              "${notes_args[@]}"
          fi
          test "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')" = true
          release_id="$(gh release view "${GITHUB_REF_NAME}" --json databaseId --jq '.databaseId')"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build-standalone-cli:
    name: Build compatible standalone CLI
    if: github.event_name == 'push'
    uses: ./.github/workflows/standalone-cli.yml
    with:
      artifact-prefix: release-cli-${{ github.run_attempt }}
      version: ${{ github.ref_name }}
      package-only: true

  accept-source:
    name: Source acceptance
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-source-candidate')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      mode: source-acceptance

  publish-standalone-cli:
    name: Publish verified standalone archives
    if: github.event_name == 'push'
    needs: [create-release, build-standalone-cli]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      readback: ${{ steps.readback.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the four standalone producer artifact IDs
        id: producers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(node scripts/updater-release.mjs standalone-artifact-ids "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Download independently built CLI archives
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.producers.outputs.ids }}
          path: ${{ runner.temp }}/standalone-candidates
          merge-multiple: true
      - name: Attach verified archives and read back their asset IDs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs attach-standalone "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/standalone-candidates" "$RELEASE_ID" > "$RUNNER_TEMP/standalone-readback.json"
      - uses: actions/upload-artifact@v4
        id: readback
        with:
          name: verified-standalone-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/standalone-readback.json
          if-no-files-found: error

  publish-desktop:
    name: Dual desktop release (${{ matrix.name }})
    if: github.event_name == 'push'
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '8'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-24.04
            msvc_arch: ''
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            platform: ubuntu-24.04-arm
            msvc_arch: ''
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            platform: windows-latest
            msvc_arch: ''
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            platform: windows-latest
            msvc_arch: amd64_arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
            pkg-config libpipewire-0.3-dev libgbm-dev libx11-dev libxi-dev libxrandr-dev
            libxtst-dev libdbus-1-dev xdg-utils squashfs-tools)
          options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          sudo apt-get "${options[@]}" update -qq
          sudo apt-get "${options[@]}" install -y --no-install-recommends "${packages[@]}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify Cargo helper ownership and bundle configuration
        run: node scripts/check-desktop-companions.mjs

      - name: Setup MSVC ARM64 toolchain
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            clients/go/go.sum
            frontends/dzc-surface/go.sum

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-thin-lto-${{ matrix.name }}

      - name: Cache Linux packaging tools
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-linux-bundle-tools-2.12.3-${{ runner.arch }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Tauri executable and MyGo Native
        id: desktop
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          pnpm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/prepare-tauri-sidecars.mjs --with-desktop --release --phase bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm run desktop:mygo:build --target "$env:TARGET_TRIPLE"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $metadata = cargo metadata --format-version 1 --no-deps --locked | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $buildRoot = Join-Path $metadata.target_directory $env:TARGET_TRIPLE
          "directory=$(Join-Path $buildRoot 'release')" >> $env:GITHUB_OUTPUT
          "sidecars=$(Join-Path $buildRoot 'release')" >> $env:GITHUB_OUTPUT

      - name: Bundle and sign Tauri using the standalone sidecars
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundle = @('exec', 'tauri', 'bundle', '--ci', '--target', $env:TARGET_TRIPLE,
                      '--features', 'tauri/custom-protocol', '--config', 'src-tauri/tauri.sidecars.json', '--bundles')
          $override = Join-Path $env:RUNNER_TEMP 'release-bundle.json'
          $config = @{ build = @{ beforeBundleCommand = $null } }
          if ($IsWindows) {
            $config.bundle = @{ windows = @{ nsis = @{ compression = 'zlib' } } }
            $bundle += 'nsis'
          } else {
            $bundle += 'deb,appimage'
          }
          Set-Content -LiteralPath $override -Value ($config | ConvertTo-Json -Depth 6 -Compress) -Encoding utf8
          $bundle += @('--config', $override)
          pnpm @bundle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package MyGo Native and the Tauri RPM
        id: additional-bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MYGO_TARGET: ${{ matrix.target }}
          MYGO_PLATFORM: ${{ matrix.name }}
          SIDECARS: ${{ steps.desktop.outputs.sidecars }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            node scripts/bundle-rpm.mjs --receipt "$RUNNER_TEMP/rpm-bundle.json" --reuse-sidecars &
            rpm_pid=$!
          fi
          result=0
          python scripts/bundle-mygo.py --target "$MYGO_PLATFORM" --sidecars "$SIDECARS" \
            --native "artifacts/dzc-desktop/$MYGO_TARGET" --output "$RUNNER_TEMP/mygo-release" \
            --revision "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --smoke || result=$?
          if [[ -n "${rpm_pid:-}" ]]; then
            wait "$rpm_pid" || result=$?
          fi
          if (( result != 0 )); then exit "$result"; fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            rpm_path="$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).artifact);' "$RUNNER_TEMP/rpm-bundle.json")"
            test -s "$rpm_path"
            echo "rpm=$rpm_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Arch Linux packages and AUR recipes
        if: matrix.name == 'linux-x86_64'
        shell: bash
        env:
          BUNDLE_ROOT: ${{ steps.desktop.outputs.directory }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          install -d "$RUNNER_TEMP/arch-release"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE/scripts/bundle-archlinux.sh:/bundle.sh:ro" \
            --volume "$BUNDLE_ROOT/bundle/deb:/tauri:ro" \
            --volume "$RUNNER_TEMP/mygo-release:/mygo:ro" \
            --volume "$RUNNER_TEMP/arch-release:/output" \
            "$DZC_ARCH_BUILDER_IMAGE" \
            bash /bundle.sh "$GITHUB_REF_NAME" "/tauri/DezirClip_${version}_amd64.deb" \
            "/mygo/DezirClip-MyGo_${version}_amd64.deb" /output

      - name: Stage both desktop variants with provenance
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.name }}
          BUNDLE_ROOT: ${{ steps.desktop.outputs.directory }}
          TAURI_RPM: ${{ steps.additional-bundles.outputs.rpm }}
        run: |
          $formats = if ($IsWindows) { @('nsis') } else { @('deb', 'appimage') }
          $files = @(foreach ($format in $formats) {
            Get-ChildItem -LiteralPath (Join-Path $env:BUNDLE_ROOT "bundle/$format") -File |
              Where-Object Extension -In '.exe', '.deb', '.AppImage', '.sig' |
              Select-Object -ExpandProperty FullName
          })
          if ($env:TAURI_RPM) { $files += $env:TAURI_RPM }
          $files += @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'mygo-release') -File |
            Select-Object -ExpandProperty FullName)
          $archPackages = Join-Path $env:RUNNER_TEMP 'arch-release'
          if (Test-Path -LiteralPath $archPackages) {
            $files += @(Get-ChildItem -LiteralPath $archPackages -File | Select-Object -ExpandProperty FullName)
          }
          node scripts/updater-release.mjs stage-desktop "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA" "$env:PLATFORM" "$env:RUNNER_TEMP/desktop-candidate" @files
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload the signed desktop build for verification
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-candidate/
          if-no-files-found: error
          compression-level: 0

  upload-desktop:
    name: Upload verified desktop assets
    if: github.event_name == 'push'
    needs: [create-release, publish-desktop]
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      readback: ${{ steps.readback.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve the four desktop producer artifact IDs
        id: producers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(node scripts/updater-release.mjs desktop-artifact-ids "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.producers.outputs.ids }}
          path: ${{ runner.temp }}/desktop-candidates
      - name: Prepare desktop archive readers
        run: |
          set -euo pipefail
          packages=()
          command -v 7z >/dev/null || packages+=(p7zip-full)
          command -v bsdtar >/dev/null || packages+=(libarchive-tools)
          command -v rpm >/dev/null || packages+=(rpm)
          command -v unsquashfs >/dev/null || packages+=(squashfs-tools)
          if (( ${#packages[@]} )); then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y --no-install-recommends "${packages[@]}"
          fi
      - name: Verify desktop archives, attach bytes and read back asset IDs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs attach-desktop "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/desktop-candidates" "$RELEASE_ID" > "$RUNNER_TEMP/desktop-readback.json"
      - uses: actions/upload-artifact@v4
        id: readback
        with:
          name: verified-desktop-assets-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-readback.json
          if-no-files-found: error

  verify-windows-candidate:
    name: Verify final Windows installer (${{ matrix.variant }})
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.publish-desktop.result == 'success') || inputs.mode == 'replay-windows-candidate') }}
    needs: publish-desktop
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [tauri, mygo]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Resolve the exact Windows x64 producer artifact
        if: github.event_name == 'push'
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(node scripts/updater-release.mjs windows-producer-id "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/windows-producer
      - name: Authenticate both installers with the release signing key
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_ID: ${{ steps.producer.outputs.artifact_id }}
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "windows-candidate-inputs"
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            node scripts/updater-release.mjs stage-windows-candidate "$env:GITHUB_REF_NAME" "$env:GITHUB_SHA" "$env:VARIANT" `
              (Join-Path $env:RUNNER_TEMP "windows-producer") $fixture "$env:PRODUCER_ID"
          } else {
            node scripts/updater-release.mjs replay-windows-candidate "$env:VARIANT" $fixture
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upgrade, launch, reinstall and uninstall the signed Windows package
        shell: pwsh
        run: |
          python scripts/release_windows_candidate.py (Join-Path $env:RUNNER_TEMP "windows-candidate-inputs") `
            (Join-Path $env:RUNNER_TEMP "windows-candidate-$env:VARIANT.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ matrix.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-candidate-${{ matrix.variant }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-candidate-diagnostics-${{ matrix.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-candidate-inputs/**/*.log

  verify-linux-runtime:
    name: Verify final Linux desktop runtime (${{ matrix.target }})
    if: ${{ !cancelled() && ((github.event_name == 'push' && needs.publish-desktop.result == 'success') || inputs.mode == 'replay-linux-runtime') }}
    needs: publish-desktop
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare native Linux acceptance
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap xvfb xauth openbox dbus-x11 python3-gi gir1.2-atspi-2.0 at-spi2-core webkit2gtk-driver libwebkit2gtk-4.1-0 libgtk-4-1 libayatana-appindicator3-1 libpipewire-0.3-0 libgbm1 libarchive-tools squashfs-tools
          setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$setting" ] && [ "$(cat "$setting")" = 1 ]; then
            sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --unshare-net --ro-bind / / --proc /proc /usr/bin/true
      - name: Resolve the exact Linux producer artifact
        if: github.event_name == 'push'
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          artifact_id="$(node scripts/updater-release.mjs linux-runtime-producer-id "$GITHUB_REF_NAME" "$GITHUB_SHA" "$TARGET")"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: github.event_name == 'push'
        with:
          artifact-ids: ${{ steps.producer.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/linux-producer
      - name: Authenticate exact Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          PRODUCER_ID: ${{ steps.producer.outputs.artifact_id }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/linux-runtime-inputs"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            node scripts/updater-release.mjs stage-linux-runtime "$GITHUB_REF_NAME" "$GITHUB_SHA" "$TARGET" \
              "$RUNNER_TEMP/linux-producer" "$fixture" "$PRODUCER_ID"
          else
            node scripts/updater-release.mjs replay-linux-runtime "$TARGET" "$fixture"
          fi
      - name: Verify shipped launchers and native package transactions
        id: exercise
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/release_linux_runtime.py "$RUNNER_TEMP/linux-runtime-inputs" "$RUNNER_TEMP/linux-runtime-evidence"
          cp "$RUNNER_TEMP/linux-runtime-evidence/linux-runtime.json" "$RUNNER_TEMP/linux-runtime-$TARGET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-runtime-${{ matrix.target }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() && steps.exercise.outcome == 'failure'
        with:
          name: linux-runtime-diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/linux-runtime-evidence/

  seal-candidate:
    name: Seal verified release candidate
    if: github.event_name == 'push'
    needs: [create-release, upload-desktop, publish-standalone-cli, accept-source, verify-windows-candidate, verify-linux-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      asset_id: ${{ steps.seal.outputs.asset_id }}
      sha256: ${{ steps.seal.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact producer artifacts for the original attempt
        id: reports
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ needs.create-release.outputs.source }}
          ACCEPTED_SOURCE: ${{ needs.accept-source.outputs.accepted_source }}
        run: |
          set -euo pipefail
          test "$RELEASE_SOURCE" = "$GITHUB_SHA"
          test "$ACCEPTED_SOURCE" = "$GITHUB_SHA"
          ids="$(node scripts/updater-release.mjs seal-input-ids "$GITHUB_REF_NAME" "$GITHUB_SHA")"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
      - name: Download source acceptance and native package reports
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.reports.outputs.ids }}
          merge-multiple: true
          path: ${{ runner.temp }}/candidate-readbacks
      - name: Attach and read back the immutable release candidate
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REPORT_IDS: ${{ steps.reports.outputs.ids }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/release-seal.json"
          node scripts/updater-release.mjs seal-dual "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/candidate-readbacks" "$RELEASE_ID" "$REPORT_IDS" > "$receipt"
          asset_id="$(jq -er .id "$receipt")"
          sha256="$(jq -er .sha256 "$receipt")"
          echo "asset_id=$asset_id" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-seal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-seal.json
          if-no-files-found: error

  verify-publish-and-promote:
    name: Verify signed artifacts, publish and synchronize update channel
    if: github.event_name == 'push'
    needs: [create-release, seal-candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the seal and activate the update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          SEAL_ID: ${{ needs.seal-candidate.outputs.asset_id }}
          SEAL_SHA256: ${{ needs.seal-candidate.outputs.sha256 }}
          DZC_PUBLICATION_TRACE: ${{ runner.temp }}/publication-stages.ndjson
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs publish-sealed-dual "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            "$RELEASE_ID" "$SEAL_ID" "$SEAL_SHA256" | tee "$RUNNER_TEMP/updater-channel-sync.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-channel-sync-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/updater-channel-sync.json
            ${{ runner.temp }}/publication-stages.ndjson
          if-no-files-found: warn
      - name: Record the first-attempt release time
        if: github.run_attempt == '1'
        shell: bash
        run: |
          node --input-type=module - "$RUNNER_TEMP/updater-channel-sync.json" <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { workflow, channel_verified_at } = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const elapsed = Math.round((Date.parse(channel_verified_at) - Date.parse(workflow.run_started_at)) / 1000);
          if (Number.isFinite(elapsed) && elapsed >= 0) {
            const minutes = (elapsed / 60).toFixed(1);
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              `### Release timing\nFirst attempt: **${minutes} minutes** from workflow start to channel publication. Target: **15–20 minutes**.\n`);
          }
          JS

  review-dual-seal:
    name: Review interrupted release seal
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'sync-dual-channel' || inputs.mode == 'resume-dual-draft')
    runs-on: ubuntu-24.04
    permissions:
      # GitHub requires push access to list draft releases. The review CLI restricts transport to GET.
      contents: write
      actions: read
    outputs:
      original_receipt_id: ${{ steps.plan.outputs.original_receipt_id }}
      review_receipt_id: ${{ steps.proof.outputs.artifact-id }}
    steps:
      - run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bound recovery to the original run, attempt and producer jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN: ${{ inputs.release-run-id }}
          RELEASE_ATTEMPT: ${{ inputs.release-run-attempt }}
        run: |
          set -euo pipefail
          result="$(node scripts/updater-release.mjs seal-recovery-plan "$RELEASE_TAG" "$RELEASE_RUN" "$RELEASE_ATTEMPT")"
          jq -r 'to_entries[] | select(.value != null) | "\(.key)=\(.value)"' <<< "$result" >> "$GITHUB_OUTPUT"
      - name: Download the original successful validation reports by ID
        if: steps.plan.outputs.report_ids != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release-run-id }}
          artifact-ids: ${{ steps.plan.outputs.report_ids }}
          merge-multiple: true
          path: ${{ runner.temp }}/original-readbacks
      - name: Reconstruct the candidate and read back its original attachment
        if: steps.plan.outputs.report_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN: ${{ inputs.release-run-id }}
          RELEASE_ATTEMPT: ${{ inputs.release-run-attempt }}
          RELEASE_ID: ${{ steps.plan.outputs.release_id }}
          REPORT_IDS: ${{ steps.plan.outputs.report_ids }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs review-interrupted-seal "$RELEASE_TAG" "$RELEASE_RUN" "$RELEASE_ATTEMPT" \
            "$RUNNER_TEMP/original-readbacks" "$RELEASE_ID" "$REPORT_IDS" > "$RUNNER_TEMP/release-seal-review.json"
      - uses: actions/upload-artifact@v4
        id: proof
        if: steps.plan.outputs.report_ids != ''
        with:
          name: reviewed-seal-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-seal-review.json
          if-no-files-found: error

  recover-dual-release:
    name: Resume dual-desktop publication or synchronize its channel
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'sync-dual-channel' || inputs.mode == 'resume-dual-draft')
    needs: review-dual-seal
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - run: test "$GITHUB_REF" = refs/heads/master
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the immutable original receipt by ID
        if: needs.review-dual-seal.outputs.original_receipt_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release-run-id }}
          artifact-ids: ${{ needs.review-dual-seal.outputs.original_receipt_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/original-seal
      - name: Download the independent review receipt by ID
        if: needs.review-dual-seal.outputs.review_receipt_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.review-dual-seal.outputs.review_receipt_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/reviewed-seal
      - name: Verify the original dual-desktop jobs and synchronize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_RUN: ${{ inputs.release-run-id }}
          RELEASE_ATTEMPT: ${{ inputs.release-run-attempt }}
          SEAL_ARTIFACT: ${{ needs.review-dual-seal.outputs.original_receipt_id }}
          REVIEW_ARTIFACT: ${{ needs.review-dual-seal.outputs.review_receipt_id }}
          DZC_PUBLICATION_TRACE: ${{ runner.temp }}/publication-stages.ndjson
        run: |
          set -euo pipefail
          receipt=()
          if [[ -n "$SEAL_ARTIFACT" ]]; then
            test -z "$REVIEW_ARTIFACT"
            receipt+=("$RUNNER_TEMP/original-seal/release-seal.json")
          elif [[ -n "$REVIEW_ARTIFACT" ]]; then
            receipt+=("$RUNNER_TEMP/reviewed-seal/release-seal-review.json" "$REVIEW_ARTIFACT")
          fi
          node scripts/updater-release.mjs "$RELEASE_MODE" "$RELEASE_TAG" "$RELEASE_RUN" "$RELEASE_ATTEMPT" "${receipt[@]}" \
            | tee "$RUNNER_TEMP/updater-channel-sync.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-channel-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/updater-channel-sync.json
            ${{ runner.temp }}/publication-stages.ndjson
          if-no-files-found: warn

  sync-published-channel:
    name: Resume verified publication or synchronize update channel
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'sync-published-channel' || inputs.mode == 'resume-verified-draft')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require reviewed synchronization tooling
        run: test "$GITHUB_REF" = refs/heads/master

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate the original successful Windows upgrade aggregate artifact
        id: upgrade-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_TAG: ${{ inputs.tag }}
          DZC_RELEASE_RUN_ID: ${{ inputs.release-run-id }}
          DZC_RELEASE_RUN_ATTEMPT: ${{ inputs.release-run-attempt }}
        run: node scripts/release-upgrade-artifact.mjs "$DZC_RELEASE_RUN_ID" "$DZC_RELEASE_RUN_ATTEMPT" "$DZC_RELEASE_TAG" "$RUNNER_TEMP/updater-upgrade-artifact.json"

      - name: Download the original release upgrade gate
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release-run-id }}
          artifact-ids: ${{ steps.upgrade-artifact.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/updater-release-gates

      - name: Verify the original release gates and publish or synchronize without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          DZC_RELEASE_TAG: ${{ inputs.tag }}
          DZC_RELEASE_RUN_ID: ${{ inputs.release-run-id }}
          DZC_RELEASE_RUN_ATTEMPT: ${{ inputs.release-run-attempt }}
          DZC_PUBLICATION_MODE: ${{ inputs.mode == 'resume-verified-draft' && 'resume-verified-draft' || 'sync-published' }}
        run: |
          set -euo pipefail
          node scripts/updater-release.mjs "$DZC_PUBLICATION_MODE" "$DZC_RELEASE_TAG" "$DZC_RELEASE_RUN_ID" "$DZC_RELEASE_RUN_ATTEMPT" "$RUNNER_TEMP/updater-release-gates/windows-upgrade.json" | tee "$RUNNER_TEMP/updater-channel-sync.json"

      - name: Retain the synchronization receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: updater-channel-backfill-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/updater-channel-sync.json
            ${{ runner.temp }}/updater-upgrade-artifact.json
          if-no-files-found: error
