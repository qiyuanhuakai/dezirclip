        run: |
          $cycles = [int]$env:MYGO_EMOJI_RUNS
          1..$cycles | ForEach-Object {
            Write-Host "Isolated Service startup and emoji paste cycle $_ of $cycles"
            powershell -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -NativeMain -Emoji
