            !${{ runner.temp }}/dezirclip-surface-*/environment/**
            !${{ runner.temp }}/dezirclip-surface-*/candidate/**
          if-no-files-found: warn

      - name: Build disposable Windows Service paste client
        if: runner.os == 'Windows' && matrix.can_test
        timeout-minutes: 12
        shell: python
        run: |
          import os, struct, subprocess, sys
          assert sys.platform == 'win32' and struct.calcsize('P') == 8
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('GITHUB_REPOSITORY') == 'qiyuanhuakai/dezirclip'
          subprocess.run(['cargo', 'build', '--locked', '-p', 'dzc-service', '--example', 'windows_service_paste_acceptance'], check=True, timeout=600)

      - name: Verify real Service-mode paste target binding on disposable Windows
        if: runner.os == 'Windows' && matrix.can_test
        timeout-minutes: 12
        shell: python
        run: |
          import os, pathlib, struct, sys, uuid
          sys.path.insert(0, 'scripts/tests')
          from native_windows_supervisor import run_controller
          assert sys.platform == 'win32' and struct.calcsize('P') == 8
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-service-paste-' + uuid.uuid4().hex)
          sys.exit(run_controller(['node', 'scripts/tests/native-windows-service-paste.mjs',
              '--desktop', 'target/debug/dezirclip.exe', '--cli', 'target/debug/dzc.exe',
              '--service', 'target/debug/dzc-service.exe',
              '--client', 'target/debug/examples/windows_service_paste_acceptance.exe',
              '--python', sys.executable, '--output-root', str(root)],
              cwd=pathlib.Path.cwd(), output_root=root))

      - name: Preserve original Service-mode target binding observations
        if: always() && runner.os == 'Windows' && matrix.can_test
        uses: actions/upload-artifact@v4
        with:
          name: native-service-paste-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dezirclip-service-paste-*/*.json
            ${{ runner.temp }}/dezirclip-service-paste-*/*.log
          if-no-files-found: warn

      - name: Stage Windows x64 MyGo package for testing
        if: matrix.name == 'windows-x86_64' && (needs.ci-desktop-plan.outputs.mode == 'full' || needs.ci-desktop-plan.outputs.mode == 'mygo-package')
        shell: pwsh
        run: |
          cargo build --locked --release -p dzc-cli -p dzc-service --no-default-features --features dzc-cli/native-screen,dzc-service/native-screen --bin dzc --bin dzc-service
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/stage-mygo-windows.py --revision "$env:GITHUB_SHA" --output "$env:RUNNER_TEMP/mygo-test-package"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          choco install nsis --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          @'
          import unittest
          suite = unittest.defaultTestLoader.discover("scripts/tests", pattern="test_installer_hook.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.testsRun or result.skipped or not result.wasSuccessful():
              raise SystemExit("Required Windows NSIS hook tests did not pass")
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "$env:RUNNER_TEMP/mygo-test-installer/DezirClip-v$version-windows-x64-MyGo-setup.exe"
          python scripts/build-mygo-installer.py --stage "$env:RUNNER_TEMP/mygo-test-package" --version "$version" --output "$installer"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/tests/mygo-installer-windows.py --stage "$env:RUNNER_TEMP/mygo-test-package" --installer "$installer" --pointer-margin 16 --follow-pointer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload Windows x64 MyGo test installer
        if: matrix.name == 'windows-x86_64' && (needs.ci-desktop-plan.outputs.mode == 'full' || needs.ci-desktop-plan.outputs.mode == 'mygo-package')
        uses: actions/upload-artifact@v4
        with:
          name: DezirClip-windows-x64-MyGo-${{ github.sha }}
          path: ${{ runner.temp }}/mygo-test-installer/*-setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Verify actual private Linux release receipt mounts
        if: runner.os == 'Linux'
        shell: python
        run: |
          import json, os, pathlib, shutil, subprocess, sys
          assert sys.platform == 'linux' and os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted' and shutil.which('bwrap'), 'Actual bubblewrap execution on the disposable Linux runner is required'
          identity = {name: os.environ[name] for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_SHA', 'RUNNER_NAME', 'RUNNER_ARCH')}
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-userns-' + identity['GITHUB_RUN_ID'] + '-' + identity['GITHUB_RUN_ATTEMPT'] + '-' + identity['GITHUB_JOB'] + '.json')
          assert receipt.is_file() and not receipt.is_symlink() and receipt.stat().st_size <= 8192, 'Original bounded userns receipt is missing'
          saved = json.loads(receipt.read_text(encoding='utf-8'))
          assert type(saved['schema_version']) is int and saved['schema_version'] == 1 and saved['status'] == 'passed' and saved['identity'] == identity, 'Original userns receipt belongs to another run/attempt/job'
          key = pathlib.Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          assert type(saved['key_exists']) is bool and saved['key_exists'] == key.exists(), 'Userns prerequisite availability changed'
          current = key.read_text().strip() if key.exists() else None
          assert (saved['before'] in ('0', '1') and saved['after'] == current == '0') if key.exists() else saved['before'] is saved['after'] is current is None, 'Userns prerequisite no longer matches its original readback'
          print('DEZIRCLIP_USERNS_PREREQUISITE_RETAINED', {'original': saved, 'current': current}, flush=True)
          subprocess.run([sys.executable, '-I', '-B', 'scripts/tests/test_release_identities.py', 'ReleaseIdentities.test_real_readonly_directory_requires_the_nested_file_mountpoint', '-v'], check=True)

      - name: Supply optional Linux x64 release inputs
        if: needs.ci-desktop-plan.outputs.mode == 'linux-release-inputs' && runner.os == 'Linux' && runner.arch == 'X64' && matrix.name == 'linux-x86_64'
        timeout-minutes: 60
        env:
          DEZIRCLIP_LINUX_RELEASE_INPUTS: 'true'
        run: python -B scripts/build-linux-release-inputs.py

      - name: Preserve optional Linux x64 release inputs and original build failures
        if: always() && needs.ci-desktop-plan.outputs.mode == 'linux-release-inputs' && runner.os == 'Linux' && runner.arch == 'X64' && matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dezirclip-linux-release-inputs-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

      - name: Record Linux x64 disk after main checks
        if: always() && runner.os == 'Linux' && runner.arch == 'X64' && matrix.name == 'linux-x86_64'
        shell: python
        run: |
          import json, os, pathlib, re, shutil, subprocess, sys
          assert sys.platform == 'linux' and os.environ.get('RUNNER_ARCH') == 'X64'
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('GITHUB_REPOSITORY') == 'qiyuanhuakai/dezirclip' and os.environ.get('GITHUB_JOB') == 'tauri'
          source = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source), 'Immutable CI checkout required'
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert workspace.is_dir() and temporary.is_dir() and workspace == pathlib.Path.cwd().resolve(strict=True)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=workspace, text=True, timeout=10).strip() == source
          def usage(root):
              disk, inode = shutil.disk_usage(root), os.statvfs(root)
              return {'bytes_total': disk.total, 'bytes_used': disk.used, 'bytes_free': disk.free,
                      'inodes_total': inode.f_files, 'inodes_free': inode.f_ffree, 'inodes_available': inode.f_favail}
          value = {'stage': 'after-main', 'source_revision': source,
                   'workspace': usage(workspace), 'runner_temp': usage(temporary)}
          encoded = json.dumps(value, sort_keys=True)
          assert len(encoded.encode('ascii')) <= 2048, 'Bounded disk summary required'
          print('DEZIRCLIP_CI_DISK', encoded, flush=True)

  windows-service-startup:
    name: Diagnose Windows Service startup
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'windows-service-startup'
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: windows-service-startup-symbols
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: frontends/dzc-surface/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the symbolized Service and its actual MyGo launcher
        shell: pwsh
        run: |
          cargo build --locked -p dzc-cli -p dzc-service --no-default-features --features dzc-cli/native-screen,dzc-service/native-screen --bin dzc --bin dzc-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-surface.mjs --desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item artifacts/dzc-desktop/x86_64-pc-windows-msvc/dzc-desktop.exe target/debug/ -ErrorAction Stop
      - name: Diagnose Windows Service startup crashes with local symbols
        timeout-minutes: 20
        shell: powershell
        run: ./scripts/tests/mygo-service-crash-stacks.ps1 -Desktop target/debug/dzc-desktop.exe

  windows-surface-performance:
    name: Windows Surface comparison or crash diagnostics
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'windows-performance' || needs.ci-desktop-plan.outputs.mode == 'windows-surface-crash'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      DZC_WINDOWS_PERFORMANCE_ENABLED: ${{ needs.ci-desktop-plan.outputs.mode == 'windows-performance' && 'true' || 'false' }}
      DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED: ${{ needs.ci-desktop-plan.outputs.mode == 'windows-surface-crash' && 'true' || 'false' }}
      DZC_WINDOWS_CRASH_BUILD_PROFILE: ${{ needs.ci-desktop-plan.outputs.crash_profile }}
      GOTOOLCHAIN: local
    steps:
      - name: Require exactly one optional Windows mode
        shell: pwsh
        run: |
          if (($env:DZC_WINDOWS_PERFORMANCE_ENABLED -eq 'true') -eq ($env:DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED -eq 'true')) {
            throw 'Select either performance or diagnostic-only functional checks'
          }
          if ($env:DZC_WINDOWS_CRASH_BUILD_PROFILE -notin @('release', 'debug')) { throw 'Unknown diagnostic build profile' }
          if ($env:DZC_WINDOWS_CRASH_BUILD_PROFILE -eq 'debug' -and $env:DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED -ne 'true') {
            throw 'Debug symbols are restricted to diagnostic-only dispatches'
          }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup native fixture runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache matching Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: windows-surface-${{ env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true' && env.DZC_WINDOWS_CRASH_BUILD_PROFILE == 'debug' && 'debug-diagnostics' || 'release-performance' }}

      - name: Setup pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            clients/go/go.sum
            frontends/dzc-surface/go.sum

      - name: Build the release frontend and matching native Surface
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm run surface:build

      - name: Build the actual release Desktop with embedded frontend
        if: env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED != 'true' || env.DZC_WINDOWS_CRASH_BUILD_PROFILE != 'debug'
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --bin dezirclip

      - name: Build the exact debug Desktop and retain its symbol receipt
        if: env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true' && env.DZC_WINDOWS_CRASH_BUILD_PROFILE == 'debug'
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: '2'
          CARGO_PROFILE_DEV_STRIP: none
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --bin dezirclip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/tests/windows-crash-diagnostics.py build-receipt --profile debug --desktop target/debug/dezirclip.exe --desktop-pdb target/debug/dezirclip.pdb --build-receipt artifacts/windows-debug-build/dezirclip.debug-build.json --helper artifacts/dzc-surface/x86_64-pc-windows-msvc/dzc-surface.exe --helper-proof artifacts/dzc-surface/x86_64-pc-windows-msvc/dzc-surface.exe.proof.json
          exit $LASTEXITCODE

      - name: Derive the comparison fixture from reviewed functional sources
        if: env.DZC_WINDOWS_PERFORMANCE_ENABLED == 'true'
        run: python -B scripts/tests/windows-performance/derive.py --output-dir .harness/windows-performance-runtime

      - name: Verify these release bytes before the sequential ABBA comparison
        id: performance-prerequisite
        if: env.DZC_WINDOWS_PERFORMANCE_ENABLED == 'true'
        timeout-minutes: 12
        shell: python
        run: |
          import datetime, json, os, pathlib, subprocess, sys, uuid
          sys.path.insert(0, 'scripts/tests')
          from native_windows_supervisor import run_controller
          assert sys.platform == 'win32' and os.environ.get('GITHUB_ACTIONS') == 'true'
          assert os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted' and os.environ.get('RUNNER_ARCH') == 'X64'
          assert os.environ.get('GITHUB_EVENT_NAME') == 'workflow_dispatch' and os.environ.get('DZC_WINDOWS_PERFORMANCE_ENABLED') == 'true'
          temporary = pathlib.Path(os.environ['RUNNER_TEMP'])
          builds_finished_at = datetime.datetime.now(datetime.timezone.utc).isoformat()
          functional = temporary / ('dezirclip-surface-' + uuid.uuid4().hex)
          desktop = pathlib.Path('target/release/dezirclip.exe')
          helper = pathlib.Path('artifacts/dzc-surface/x86_64-pc-windows-msvc/dzc-surface.exe')
          common = ['--desktop', str(desktop), '--helper', str(helper), '--helper-proof', str(helper) + '.proof.json', '--python', sys.executable]
          functional_exit = run_controller(['node', 'scripts/tests/native-windows-surface.mjs', *common, '--output-root', str(functional)],
              cwd=pathlib.Path.cwd(), output_root=functional)
          if functional_exit:
              raise SystemExit(functional_exit)
          quiet = temporary / ('dezirclip-performance-quiet-' + uuid.uuid4().hex + '.json')
          note = {'source_revision': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'builds_finished': True, 'builds_finished_at': builds_finished_at,
                  'other_owned_measurements_running': False, 'shared_host_quiet_verified': False,
                  'scope': 'This job runs functional acceptance and measurement sequentially after its builds; no claim about the shared physical host.'}
          with quiet.open('x', encoding='utf-8') as stream:
              json.dump(note, stream, indent=2)
          comparison = temporary / ('dezirclip-performance-' + uuid.uuid4().hex)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              for name, value in [('functional_root', functional), ('quiet_note', quiet), ('comparison_root', comparison)]:
                  assert '\n' not in str(value) and '\r' not in str(value)
                  stream.write(name + '=' + str(value) + '\n')

      - name: Run the complete sequential release ABBA comparison
        if: env.DZC_WINDOWS_PERFORMANCE_ENABLED == 'true'
        shell: python
        env:
          DZC_FUNCTIONAL_ROOT: ${{ steps.performance-prerequisite.outputs.functional_root }}
          DZC_QUIET_NOTE: ${{ steps.performance-prerequisite.outputs.quiet_note }}
          DZC_COMPARISON_ROOT: ${{ steps.performance-prerequisite.outputs.comparison_root }}
        run: |
          import os, pathlib, subprocess, sys
          functional = pathlib.Path(os.environ['DZC_FUNCTIONAL_ROOT'])
          quiet = pathlib.Path(os.environ['DZC_QUIET_NOTE'])
          comparison = pathlib.Path(os.environ['DZC_COMPARISON_ROOT'])
          assert all(path.is_absolute() for path in (functional, quiet, comparison))
          helper = pathlib.Path('artifacts/dzc-surface/x86_64-pc-windows-msvc/dzc-surface.exe')
          common = ['--desktop', 'target/release/dezirclip.exe', '--helper', str(helper), '--helper-proof', str(helper) + '.proof.json', '--python', sys.executable]
          subprocess.run(['node', '.harness/windows-performance-runtime/controller.mjs', *common,
              '--functional-report', str(functional / 'report.json'), '--quiet-note', str(quiet), '--output-root', str(comparison)], check=True)

      - name: Run up to five success-only diagnostic cases on the selected build
        id: crash-diagnostics
        if: env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true'
        timeout-minutes: 55
        shell: pwsh
        run: ./scripts/tests/windows-crash-diagnostics.ps1 -Mode run -Profile $env:DZC_WINDOWS_CRASH_BUILD_PROFILE

      - name: Restore only the matching owned WER child key
        if: always() && env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true' && steps.crash-diagnostics.outputs.root != ''
        shell: pwsh
        env:
          DZC_CRASH_DIAGNOSTICS_ROOT: ${{ steps.crash-diagnostics.outputs.root }}
        run: ./scripts/tests/windows-crash-diagnostics.ps1 -Mode cleanup -Root $env:DZC_CRASH_DIAGNOSTICS_ROOT

      - name: Preserve original functional failures and crash metadata
        if: always() && env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true' && (steps.crash-diagnostics.outputs.sequence_root != '' || steps.crash-diagnostics.outputs.root != '')
        uses: actions/upload-artifact@v4
        with:
          name: windows-surface-${{ env.DZC_WINDOWS_CRASH_BUILD_PROFILE == 'debug' && 'debug' || 'release' }}-crash-metadata-${{ github.run_attempt }}
          retention-days: 3
          path: |
            ${{ steps.crash-diagnostics.outputs.sequence_root != '' && format('{0}/**/*', steps.crash-diagnostics.outputs.sequence_root) || '' }}
            ${{ steps.crash-diagnostics.outputs.root != '' && format('{0}/*.json', steps.crash-diagnostics.outputs.root) || '' }}
            ${{ steps.crash-diagnostics.outputs.functional_root != '' && format('{0}/*.json', steps.crash-diagnostics.outputs.functional_root) || '' }}
            ${{ steps.crash-diagnostics.outputs.functional_root != '' && format('{0}/*.log', steps.crash-diagnostics.outputs.functional_root) || '' }}
            ${{ steps.crash-diagnostics.outputs.functional_root != '' && format('{0}/*.png', steps.crash-diagnostics.outputs.functional_root) || '' }}
          if-no-files-found: error

      - name: Preserve only the identity-bound original Desktop dump
        if: always() && env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true' && steps.crash-diagnostics.outputs.accepted_dump != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-surface-${{ env.DZC_WINDOWS_CRASH_BUILD_PROFILE == 'debug' && 'debug' || 'release' }}-owned-crash-dump-${{ github.run_attempt }}
          retention-days: 3
          compression-level: 1
          path: ${{ steps.crash-diagnostics.outputs.accepted_dump }}
          if-no-files-found: error

      - name: Preserve the exact debug EXE, PDB and build receipt
        if: always() && env.DZC_WINDOWS_CRASH_DIAGNOSTICS_ENABLED == 'true' && env.DZC_WINDOWS_CRASH_BUILD_PROFILE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: windows-surface-debug-build-symbols-${{ github.run_attempt }}
          retention-days: 3
          compression-level: 1
          path: |
            target/debug/dezirclip.exe
            target/debug/dezirclip.pdb
            artifacts/windows-debug-build/dezirclip.debug-build.json
          if-no-files-found: error

      - name: Preserve original comparison sources, observations and failures
        if: always() && env.DZC_WINDOWS_PERFORMANCE_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-surface-release-performance-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .harness/windows-performance-runtime/*
            ${{ runner.temp }}/dezirclip-performance-quiet-*.json
            ${{ runner.temp }}/dezirclip-surface-*/*.json
            ${{ runner.temp }}/dezirclip-surface-*/*.log
            ${{ runner.temp }}/dezirclip-surface-*/*.png
            ${{ runner.temp }}/dezirclip-performance-*/comparison.json
            ${{ runner.temp }}/dezirclip-performance-*/dezirclip-surface-*/*.json
            ${{ runner.temp }}/dezirclip-performance-*/dezirclip-surface-*/*.jsonl
            ${{ runner.temp }}/dezirclip-performance-*/dezirclip-surface-*/*.log
          if-no-files-found: warn

  standalone-cli:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'full'
    name: Compatible standalone CLI
    uses: ./.github/workflows/standalone-cli.yml
    with:
      artifact-prefix: acceptance-cli

  native-nsis-fixtures:
    needs: ci-desktop-plan
    name: Build shared native NSIS fixtures
    if: needs.ci-desktop-plan.outputs.mode == 'full'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.upload-fixtures.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Check native installer tests and packaging contracts
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_native_windows_clipboard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts/tests -p test_native_windows_nsis_webview.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/tests/packaging-sidecars.node.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/tests/native-packaging-proof.ps1
          ./scripts/tests/native-process-identity.ps1
          ./scripts/tests/native-build-info.ps1
          ./scripts/tests/native-installer-outcomes.ps1
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-debug-installers
      - run: pnpm install --frozen-lockfile
      - name: Build the two same-source installer fixtures
        shell: pwsh
        run: |
          $root = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/native-nsis-inputs"
          ./scripts/build-native-windows-fixture.ps1 -Version 0.2.0-alpha.1 -Destination (Join-Path $root.FullName 'previous-setup.exe')
          ./scripts/build-native-windows-fixture.ps1 -Version 0.2.0-alpha.2 -Destination (Join-Path $root.FullName 'candidate-setup.exe')
      - uses: actions/upload-artifact@v4
        id: upload-fixtures
        with:
          name: native-nsis-inputs-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-nsis-inputs/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-windows-upgrade:
    needs: [ci-desktop-plan, native-nsis-fixtures]
    if: needs.ci-desktop-plan.outputs.mode == 'full'
    # Keep scenario identities distinct for the full release acceptance gate.
    name: Native NSIS (${{ matrix.scenario }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [LegacyUninstall, OldToNew, PublishedAlphaToAlpha, OwnedUpgrade, OwnedExternalEdit, DeniedGuiUpgrade]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup native clipboard fixture runtime
        if: matrix.scenario != 'LegacyUninstall'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Download the original same-source NSIS fixtures
        if: matrix.scenario != 'LegacyUninstall'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-nsis-fixtures.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-nsis-inputs

      - name: Download pinned published legacy installer
        if: matrix.scenario == 'LegacyUninstall' || matrix.scenario == 'OldToNew'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/qiyuanhuakai/dezirclip/releases/download/v0.1.20/DezirClip_0.1.20_x64-setup.exe' -OutFile "$env:RUNNER_TEMP/legacy-setup.exe" -MaximumRetryCount 3 -RetryIntervalSec 5

      - name: Download pinned published alpha.1 installer
        if: matrix.scenario == 'PublishedAlphaToAlpha'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/qiyuanhuakai/dezirclip/releases/download/v0.2.0-alpha.1/DezirClip_0.2.0-alpha.1_x64-setup.exe' -OutFile "$env:RUNNER_TEMP/legacy-setup.exe" -MaximumRetryCount 3 -RetryIntervalSec 5

      - name: Exercise actual installer and application
        shell: pwsh
        run: |
          $inputs = "$env:RUNNER_TEMP/native-nsis-inputs"
          ./scripts/test-native-windows-upgrade.ps1 -Scenario '${{ matrix.scenario }}' -OldInstaller "$env:RUNNER_TEMP/legacy-setup.exe" -NewInstaller "$inputs/candidate-setup.exe" -PreviousCandidate "$inputs/previous-setup.exe"

      - name: Preserve isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-nsis-${{ matrix.scenario }}
          path: ${{ runner.temp }}/dezirclip-upgrade-*/
          if-no-files-found: ignore

  flatpak:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'full'
    name: Verified Flatpak
    uses: ./.github/workflows/flatpak.yml
    with:
      artifact-prefix: acceptance-flatpak

  mygo-installer:
    name: MyGo installer acceptance
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.legacy_installer == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'
      - name: Prepare immutable released MyGo payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/package-published-mygo.py --output "${{ runner.temp }}/mygo-installer-input"
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/build-mygo-installer.py --stage "$env:RUNNER_TEMP/mygo-installer-input/stage" --version 0.2.0-alpha.9 --output "$env:RUNNER_TEMP/DezirClip-v0.2.0-alpha.9-windows-x64-MyGo-setup.exe"
      - name: Verify installation, installed desktop, upgrade, locked files and uninstall
        run: python scripts/tests/mygo-installer-windows.py --stage "${{ runner.temp }}/mygo-installer-input/stage" --installer "${{ runner.temp }}/DezirClip-v0.2.0-alpha.9-windows-x64-MyGo-setup.exe" --pointer-margin 5 --legacy-close-after-paste
      - name: Verify the same installer source with a non-ANSI installation path
        shell: pwsh
        run: |
          python scripts/build-mygo-installer.py --stage "$env:RUNNER_TEMP/mygo-installer-input/stage" --version 0.2.0-alpha.9 --output "$env:RUNNER_TEMP/mygo-unicode-fixture.exe" --unicode-path-fixture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/tests/mygo-installer-windows.py --stage "$env:RUNNER_TEMP/mygo-installer-input/stage" --installer "$env:RUNNER_TEMP/mygo-unicode-fixture.exe" --unicode-path-fixture --pointer-margin 5 --legacy-close-after-paste
      - uses: actions/upload-artifact@v4
        with:
          name: MyGo-installer-${{ github.sha }}
          path: ${{ runner.temp }}/DezirClip-v0.2.0-alpha.9-windows-x64-MyGo-setup.exe
          if-no-files-found: error

  rust-development:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.development == 'true'
    name: Rust development (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        mode: [core-tests, desktop-check]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        env:
          RUST_CHECK_MODE: ${{ matrix.mode }}
        run: |
          packages=(libpipewire-0.3-dev libgbm-dev libx11-dev libxi-dev libxrandr-dev libxtst-dev libdbus-1-dev
            libegl-dev libwayland-dev libfontconfig1-dev libfreetype-dev)
          if [[ "$RUST_CHECK_MODE" == desktop-check ]]; then
            packages+=(libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev)
          else
            packages+=(xvfb xauth dbus-daemon)
          fi
          network=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          install_libraries() {
            sudo apt-get "${network[@]}" "$@" update -qq &&
              sudo apt-get "${network[@]}" "$@" install -y --no-install-recommends "${packages[@]}"
          }
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          if [[ -f "$ubuntu_sources" ]]; then
            fast_sources="$RUNNER_TEMP/rust-dev-ubuntu.sources"
            sed -E \
              -e 's|^URIs: .*apt-mirrors[.]txt.*$|URIs: https://archive.ubuntu.com/ubuntu/|' \
              -e 's|^URIs: https?://([^/ ]+[.])?archive[.]ubuntu[.]com/ubuntu/?[[:space:]]*$|URIs: https://archive.ubuntu.com/ubuntu/|' \
              -e 's|^URIs: http://security[.]ubuntu[.]com/ubuntu/?[[:space:]]*$|URIs: https://security.ubuntu.com/ubuntu/|' \
              "$ubuntu_sources" > "$fast_sources"
            if install_libraries -o "Dir::Etc::sourcelist=$fast_sources" -o Dir::Etc::sourceparts=-; then
              exit 0
            fi
          fi
          install_libraries
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: development-${{ matrix.mode }}-no-debug
          cache-workspace-crates: true
      - name: Test shared core, protocol, Host, Service and CLI
        if: matrix.mode == 'core-tests' && runner.os == 'Windows'
        run: cargo test --locked --workspace --all-targets --no-default-features --features dzc-cli/native-screen,dzc-service/native-screen
      - name: Test Linux workspace and isolated Platform
        if: matrix.mode == 'core-tests' && runner.os == 'Linux'
        run: python3 -B scripts/test-linux-platform.py --workspace
      - name: Verify the bare CLI in a real Windows pseudoterminal
        if: matrix.mode == 'core-tests' && runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p dzc-cli --no-default-features --features native-screen --bin dzc
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install --disable-pip-version-check pywinpty==3.1.0 pyte==0.8.2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:DZC_TEST_BIN = (Resolve-Path target/debug/dzc.exe).Path
          @'
          import unittest
          from integrations.tests.test_native_tui import NativeTuiPasteTests
          suite = unittest.defaultTestLoader.loadTestsFromTestCase(NativeTuiPasteTests)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not (result.wasSuccessful() and result.testsRun and not result.skipped))
          '@ | python -
      - name: Check all desktop targets without linking another application
        if: matrix.mode == 'desktop-check'
        run: cargo check --locked --workspace --all-targets

  go-development:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.development == 'true'
    name: Go development (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            clients/go/go.sum
            frontends/dzc-surface/go.sum
      - name: Resolve Ubuntu's CJK font package
        if: runner.os == 'Linux'
        id: cjk-fonts
        run: |
          if ! metadata=$(apt-cache --no-all-versions show fonts-noto-cjk) || [[ -z "$metadata" ]]; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq
            metadata=$(apt-cache --no-all-versions show fonts-noto-cjk)
          fi
          archive=$(sed -n 's/^Filename: //p' <<< "$metadata")
          checksum=$(sed -n 's/^SHA256: //p' <<< "$metadata")
          [[ "$archive" =~ ^pool/main/f/fonts-noto-cjk/fonts-noto-cjk_[a-zA-Z0-9.+~_-]+_all\.deb$ ]]
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          printf 'archive=%s\nchecksum=%s\n' "$archive" "$checksum" >> "$GITHUB_OUTPUT"
      - name: Cache verified CJK font download
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fonts-noto-cjk.deb
          key: go-development-cjk-fonts-${{ steps.cjk-fonts.outputs.checksum }}
      - name: Provision CJK fonts for headless rendering tests
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          FONT_ARCHIVE: ${{ steps.cjk-fonts.outputs.archive }}
          FONT_SHA256: ${{ steps.cjk-fonts.outputs.checksum }}
        run: |
          font_package="$RUNNER_TEMP/fonts-noto-cjk.deb"
          verify_font_package() {
            printf '%s  %s\n' "$FONT_SHA256" "$font_package" | sha256sum --check --status
          }
          if [[ ! -f "$font_package" ]] || ! verify_font_package; then
            for mirror in https://archive.ubuntu.com/ubuntu https://mirrors.kernel.org/ubuntu https://ftp.osuosl.org/pub/ubuntu; do
              if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 55 \
                --output "$font_package" "$mirror/$FONT_ARCHIVE" && verify_font_package; then
                break
              fi
            done
          fi
          printf '%s  %s\n' "$FONT_SHA256" "$font_package" | sha256sum --check --strict
          sudo dpkg -i "$font_package"
          fc-match 'sans-serif:lang=zh-cn'
      - name: Test local protocol client
        working-directory: clients/go
        run: go test ./...
      - name: Verify WebView fixture environment restoration
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/native-webview-environment.ps1
      - name: Test MyGo desktop and native surfaces
        working-directory: frontends/dzc-surface
        env:
          DZC_VISUAL_DIR: ${{ github.workspace }}/target/native-development-visuals
        run: go test ./...
      - name: Preserve native development renderings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-development-visuals-${{ matrix.os }}-${{ github.sha }}
          path: target/native-development-visuals/*.png
          if-no-files-found: warn

  source-acceptance:
    name: ${{ needs.ci-desktop-plan.outputs.mode == 'source-acceptance' && 'Bind candidate source' || 'Summarize CI acceptance' }}
    needs:
      - ci-desktop-plan
      - frontend
      - rust-development
      - go-development
      - tauri
      - darwin-native
      - windows-release-memory
      - native-file-drag
      - windows-service-startup
      - windows-surface-performance
      - standalone-cli
      - native-nsis-fixtures
      - native-windows-upgrade
      - flatpak
      - mygo-installer
    if: always()
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      source: ${{ steps.bind.outputs.source }}
      artifact: ${{ steps.upload-source.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check required job and step results
        id: bind
        env:
          DEPENDENCIES: ${{ toJSON(needs) }}
          CI_REPORTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/ci_policy.py summarize
      - uses: actions/upload-artifact@v4
        if: needs.ci-desktop-plan.outputs.mode == 'source-acceptance'
        id: upload-source
        with:
          name: source-acceptance-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-acceptance.json
          if-no-files-found: error
