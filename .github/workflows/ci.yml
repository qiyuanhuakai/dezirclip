name: CI

on:
  push:
    branches:
      - master
  # Every PR, including stacked PRs, runs the development checks.
  pull_request:
  workflow_call:
    inputs:
      full_validation:
        type: boolean
        default: true
      source_acceptance:
        type: boolean
        default: false
    outputs:
      accepted_source:
        description: Candidate commit that passed the required source jobs
        value: ${{ jobs.source-acceptance.outputs.source }}
      accepted_artifact:
        description: Immutable artifact ID of the exact source acceptance receipt
        value: ${{ jobs.source-acceptance.outputs.artifact }}
  workflow_dispatch:
    inputs:
      mode:
        description: Acceptance mode. Auto supports legacy inputs during migration.
        type: choice
        default: auto
        options:
          - auto
          - development
          - full
          - source-acceptance
          - darwin-native
          - native-file-drag
          - historical-windows-memory
          - mygo-package
          - linux-release-inputs
          - windows-performance
          - windows-crash
      windows_crash_target:
        description: Target for the named Windows crash mode
        type: choice
        default: auto
        options:
          - auto
          - service-startup
          - surface
      macos_native_probe:
        description: Run the opt-in Darwin native foundations before SwiftUI integration
        type: boolean
        default: false
      native_file_drag_only:
        description: Run focused native file drag acceptance without the Tauri packaging build
        type: boolean
        default: false
      windows_release_memory:
        description: Compare published alpha.8 and alpha.9 Windows memory with synthetic history
        type: boolean
        default: false
      full_validation:
        description: Legacy auto-mode default for requests without a focused input
        type: boolean
        default: true
      source_acceptance:
        description: Run the same source acceptance used by Release
        type: boolean
        default: false
      windows_service_crash_stacks:
        description: Diagnose up to 32 fresh-profile Service starts, printing crash stacks without uploading memory
        type: boolean
        required: false
        default: false
      windows_x64_mygo_test_package:
        description: Upload the standalone Windows x64 MyGo test desktop after native acceptance
        type: boolean
        required: false
        default: false
      linux_release_inputs:
        description: Supply source-bound Linux x64 release Desktop and existing Surface inputs without native acceptance
        type: boolean
        required: false
        default: false
      windows_surface_performance:
        description: Run the optional release Windows Tauri/MyGo comparison after functional checks
        type: boolean
        required: false
        default: false
      windows_surface_crash_diagnostics:
        description: Run up to five fresh-profile Windows diagnostic cases, stopping on first failure, without ABBA
        type: boolean
        required: false
        default: false
      windows_crash_build_profile:
        description: Diagnostic-only Desktop profile; debug preserves its exact EXE and PDB
        type: choice
        required: false
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: ci-${{ (inputs.source_acceptance || inputs.mode == 'source-acceptance') && 'source-acceptance' || (inputs.macos_native_probe || inputs.mode == 'darwin-native') && 'darwin-native' || github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.source_acceptance && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}

env:
  CARGO_TERM_COLOR: always
  DZC_BUILD_REVISION: ${{ github.sha }}
  DEZIRCLIP_DISABLE_LINUX_SERVICES: window_tracker,edge_docking,mouse_hotkey

jobs:
  darwin-native:
    name: Darwin native foundations
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'darwin-native'
    runs-on: macos-26
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: darwin-native
      - name: Test Swift framing, protocol and sessions
        run: swift test --package-path clients/swift
      - name: Exercise real Darwin path and transport guards
        run: |
          cargo test --locked -p dzc-core --lib infrastructure::local_file::tests
          cargo test --locked -p dzc-platform --features ipc --lib -- ipc:: darwin_clipboard::
      - name: Exercise shared Host authorization, history and snapshots
        run: cargo test --locked -p dzc-host --lib
      - name: Build and sign Darwin probe binaries
        run: |
          cargo build --locked -p dzc-platform -p dzc-host --features dzc-platform/ipc,dzc-host/darwin-helper --bin dzc-darwin-host --example ipc_protocol_fixture --example darwin_desktop_fixture
          swift build --package-path clients/swift --product DarwinPeerProbe
          swift_bin=$(swift build --package-path clients/swift --show-bin-path)
          cp "$swift_bin/DarwinPeerProbe" "$RUNNER_TEMP/dzc-darwin-peer"
          codesign --force --sign - target/debug/examples/ipc_protocol_fixture
          codesign --force --sign - "$RUNNER_TEMP/dzc-darwin-peer"
          app="$RUNNER_TEMP/DezirClipHostProbe.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Helpers"
          cp "$swift_bin/DarwinPeerProbe" "$app/Contents/MacOS/DarwinPeerProbe"
          cp target/debug/examples/darwin_desktop_fixture "$app/Contents/Helpers/dzc-darwin-host"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>DarwinPeerProbe</string>
            <key>CFBundleIdentifier</key><string>io.github.qiyuanhuakai.dezirclip.host-probe</string>
            <key>CFBundleName</key><string>DezirClip Host Probe</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          PLIST
          version=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          /usr/libexec/PlistBuddy -c "Add :DezirClipCoreVersion string $version" "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - --options runtime --identifier io.github.qiyuanhuakai.dezirclip.host-probe.helper "$app/Contents/Helpers/dzc-darwin-host"
          codesign --force --sign - --options runtime "$app"
          codesign --verify --deep --strict "$app"
          production="$RUNNER_TEMP/DezirClipHostProduction.app"
          cp -R "$app" "$production"
          cp target/debug/dzc-darwin-host "$production/Contents/Helpers/dzc-darwin-host"
          codesign --force --sign - --options runtime --identifier io.github.qiyuanhuakai.dezirclip.host-probe.helper "$production/Contents/Helpers/dzc-darwin-host"
          codesign --force --sign - --options runtime "$production"
          codesign --verify --deep --strict "$production"
      - name: Verify profile persistence across signed helper processes
        run: |
          root=$(mktemp -d /private/tmp/dzc-profile.XXXXXX)
          "$RUNNER_TEMP/DezirClipHostProbe.app/Contents/Helpers/dzc-darwin-host" --verify-profile "$root"
      - name: Verify signed Swift sessions against the local Rust Host and platform fixture
        run: |
          socket_dir=$(mktemp -d /private/tmp/dzc-m0.XXXXXX)
          "$RUNNER_TEMP/dzc-darwin-peer" "$PWD/target/debug/examples/ipc_protocol_fixture" "$socket_dir"
          if "$RUNNER_TEMP/dzc-darwin-peer" --bundled-host "$socket_dir/rejected" 2>"$socket_dir/outer-launch.log"; then
            echo "A bare probe started the bundled Host"
            exit 1
          fi
          grep -Fx 'the Host must be launched from the signed app bundle' "$socket_dir/outer-launch.log"
          test ! -e "$socket_dir/rejected"
          probe="$RUNNER_TEMP/DezirClipHostProbe.app/Contents/MacOS/DarwinPeerProbe"
          ln -s "$socket_dir" "$socket_dir/linked-profile"
          if "$probe" --bundled-host "$socket_dir/linked-profile" 2>"$socket_dir/linked-profile.log"; then
            echo "The bundled launcher accepted a linked profile directory"
            exit 1
          fi
          grep -Fx 'helper directory must be private and owned by the current user' "$socket_dir/linked-profile.log"
          "$probe" --bundled-host "$socket_dir/desktop"
      - name: Verify the production Darwin helper with its own Keychain
        run: |
          socket_dir=$(mktemp -d /private/tmp/dzc-helper.XXXXXX)
          production="$RUNNER_TEMP/DezirClipHostProduction.app"
          helper="$production/Contents/Helpers/dzc-darwin-host"
          if (set -o pipefail; printf '' | "$helper" "$socket_dir/foreign-parent" 2>"$socket_dir/foreign-parent.log" | cat); then
            echo "The production helper accepted a launcher outside its bundle"
            exit 1
          fi
          grep -F 'helper requires private pipes from its signed app launcher' "$socket_dir/foreign-parent.log"
          test ! -e "$socket_dir/foreign-parent"
          saved=$(security default-keychain -d user | awk -F '"' '{print $2}')
          test -n "$saved"
          keychain="$socket_dir/production.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          trap 'security default-keychain -d user -s "$saved"; security delete-keychain "$keychain"' EXIT
          security unlock-keychain -p "$password" "$keychain"
          security default-keychain -d user -s "$keychain"
          production_probe="$production/Contents/MacOS/DarwinPeerProbe"
          DZC_DARWIN_RESOURCE_REPORT="$RUNNER_TEMP/darwin-resources.json" "$production_probe" --bundled-production "$socket_dir/production"
      - name: Preserve signed Darwin helper measurements
        uses: actions/upload-artifact@v4
        with:
          name: darwin-resources-${{ github.run_attempt }}
          path: ${{ runner.temp }}/darwin-resources.json
          if-no-files-found: error

  windows-release-memory:
    name: Published Windows memory comparison
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'historical-windows-memory'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install measurement dependencies
        run: python -m pip install psutil==7.2.2 Pillow==13.0.0 websocket-client==1.9.2
      - name: Measure original published executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s scripts/tests -p test_release_memory_probe.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/tests/release-memory-windows.py
      - name: Preserve measurements and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-windows-memory-${{ github.run_attempt }}
          path: |
            .harness/release-memory/*.json
            .harness/release-memory/*.log
            .harness/release-memory/*/identity.json
          retention-days: 14

  frontend:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.development == 'true' || needs.ci-desktop-plan.outputs.desktop == 'true'
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: needs.ci-desktop-plan.outputs.development == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ needs.ci-desktop-plan.outputs.development == 'true' && 'pnpm' || '' }}

      - name: Setup Python for shared tooling contracts
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Test portable tooling and release contracts
        run: |
          python -B -m scripts.ci_contracts portable
          python -I -B -m unittest discover -s scripts -p test_release_recovery.py -v
          python -B -m unittest discover -s scripts/performance/tests -v

      - name: Check pinned MyGo dependency before installing frontend packages
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: node --test scripts/tests/mygo-surface-patch.node.mjs

      - name: Install frontend dependencies
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check i18n keys
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: pnpm run i18n:check

      - name: Check synchronized release versions
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: pnpm run release:set-version --check

      - name: Check shared Surface design tokens
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: pnpm run surface:tokens --check

      - name: Check embedded emoji catalog
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: node scripts/emoji-catalog/sync-embed.mjs --check

      - name: Test independent Surface build identity
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: node --test scripts/tests/surface-build.node.mjs

      - name: Test disposable native Surface fixture contracts
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: |
          node --test scripts/tests/native-windows-surface.node.mjs scripts/tests/native-windows-crash-events.node.mjs scripts/tests/native-windows-lifecycle.node.mjs scripts/tests/native-windows-service-paste.node.mjs scripts/tests/native-ownership-discovery.node.mjs

      - name: Test opt-in Windows performance fixture contracts without native execution
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: |
          python -B scripts/tests/windows-performance/derive.py --output-dir .harness/windows-performance-pure-check
          node --test .harness/windows-performance-pure-check/pure.node.mjs

      - name: Check single-source local protocol generation
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: python scripts/generate-protocol.py --check

      - name: Test updater release gates
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: |
          bash -n scripts/bundle-archlinux.sh
          node --test scripts/tests/set-release-version.node.mjs scripts/tests/updater-release.node.mjs scripts/tests/release-windows-upgrade.node.mjs scripts/tests/release-upgrade-artifact.node.mjs

      - name: Check final Windows upgrade source boundary
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: python -I -B scripts/tests/release-windows-upgrade-ps.py

      - name: Check theme CSS contracts
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: node scripts/audit-theme-css.mjs --check

      - name: Run unit tests
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: pnpm run test:unit

      - name: Build frontend
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: pnpm run build

      - name: Verify production WebView startup
        if: needs.ci-desktop-plan.outputs.development == 'true'
        run: |
          if [[ ! -x /usr/bin/google-chrome ]]; then
            pnpm exec playwright install chromium --only-shell
          fi
          node scripts/tests/verify-desktop-web.mjs

  native-file-drag:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.mode == 'native-file-drag'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: frontends/dzc-surface/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Linux native fixture dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libxcb1-dev libx11-dev libxi-dev libxtst-dev libxrandr-dev libpipewire-0.3-dev libgbm-dev libwayland-dev libegl-dev libfontconfig1-dev libwebkit2gtk-4.1-0 libayatana-appindicator3-1 python3-gi python3-psutil python3-pil gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core xvfb dbus-x11 openbox x11-utils gnome-keyring fonts-noto-cjk pulseaudio pulseaudio-utils xclip ffmpeg
      - name: Build Service and native Desktop
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run desktop:mygo:build
          cargo build --locked -p dzc-cli -p dzc-service --no-default-features --features dzc-cli/native-screen,dzc-service/native-screen --bin dzc --bin dzc-service
      - name: Verify isolated video frames and native crash evidence
        run: python scripts/tests/media-preview.py
      - name: Verify actual Windows file transfers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item artifacts/dzc-desktop/x86_64-pc-windows-msvc/dzc-desktop.exe target/debug/
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -FileDrag
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -NativeMain
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -NativeMain -Emoji
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -Lifecycle
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -TrayPaste
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -RichPaste
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -QuickPasteInput
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -MiddleShortcut
          ./scripts/tests/mygo-desktop-windows.ps1 -Desktop target/debug/dzc-desktop.exe -RecoverService
          cargo test --locked -p dzc-platform --features ipc ipc::windows::tests
      - name: Verify actual Linux file transfers
        if: runner.os == 'Linux'
        run: |
          cp "artifacts/dzc-desktop/$(rustc --print host-tuple)/dzc-desktop" target/debug/dzc-desktop
          /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --file-drag
          /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --screenshots
          DEZIRCLIP_DISABLE_LINUX_SERVICES=window_tracker,edge_docking /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --idle
      - name: Verify X11 screenshot pixels across color depths
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p dzc-platform --features native-screen --lib --no-run
          for depth in 16 24 30; do
            DEZIRCLIP_RUN_SCREENSHOT_SMOKE_TESTS=1 XDG_SESSION_TYPE=x11 xvfb-run -a -s "-screen 0 640x480x${depth}" cargo test --locked -p dzc-platform --features native-screen native_x11_capture_matches_root_pixels -- --nocapture
          done

  ci-desktop-plan:
    name: Select desktop acceptance targets
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.targets.outputs.mode }}
      desktop: ${{ steps.targets.outputs.desktop }}
      matrix: ${{ steps.targets.outputs.matrix }}
      development: ${{ steps.targets.outputs.development }}
      legacy_installer: ${{ steps.targets.outputs.legacy_installer }}
      crash_profile: ${{ steps.targets.outputs.crash_profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the mode and scenario policy
        run: python -B -m unittest discover -s scripts/tests -p test_ci_policy.py
      - name: Select desktop targets and required checks
        id: targets
        env:
          CI_INPUTS: ${{ toJSON(inputs) }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python -B scripts/ci_policy.py plan

  tauri:
    needs: ci-desktop-plan
    if: needs.ci-desktop-plan.outputs.desktop == 'true'
    # GitHub displays this template literally when the job is skipped before matrix expansion.
    name: Tauri backend (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    env:
      DZC_COMPANION_TARGET: ${{ matrix.rust_target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.ci-desktop-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the active Explorer prerequisite for final release upgrades
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $processes = @(Get-Process explorer -ErrorAction SilentlyContinue)
          try {
            $original = @($processes | ForEach-Object { @{ pid = $_.Id; started_at = $_.StartTime.ToUniversalTime().ToString('o') } })
            ConvertTo-Json -InputObject $original -Depth 4
            if ($original.Count -eq 0) { throw 'Final release upgrade acceptance requires an active original Explorer; an empty process set cannot prove preservation.' }
          } finally { foreach ($process in $processes) { $process.Dispose() } }

      - name: Setup Python for archive validation
        if: runner.os == 'Windows' && matrix.can_test
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Setup standalone Python for Linux SQLite fixtures
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_MANAGED_PYTHON: '1'
        with:
          version: '0.13.3'
          python-version: '3.13.15'
          activate-environment: true
          venv-path: ${{ runner.temp }}/dezirclip-fixture-python
          enable-cache: false

      - name: Require compatible SQLite for synthetic FTS5 fixtures
        if: matrix.can_test
        run: >-
          python -c "import sqlite3; print('Fixture SQLite', sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 50, 4), 'Synthetic schema20 fixtures require SQLite >=3.50.4'; connection=sqlite3.connect(':memory:'); connection.execute('CREATE VIRTUAL TABLE fixture_fts USING fts5(content)'); connection.close()"

      - name: Permit private user namespaces on disposable Linux runner
        if: runner.os == 'Linux'
        shell: python
        run: |
          import json, os, pathlib, re, subprocess, sys
          assert sys.platform == 'linux' and os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted', 'Only a disposable Actions Linux runner may configure this prerequisite'
          # Ubuntu 24.04 mediates capabilities within unprivileged user namespaces:
          # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
          key = pathlib.Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          print('DEZIRCLIP_USERNS_PREREQUISITE', {'key_exists': key.exists(), 'apparmor_label': pathlib.Path('/proc/self/attr/current').read_text().strip()}, flush=True)
          before = after = None
          if key.exists():
              before = key.read_text().strip()
              assert before in ('0', '1'), 'Unknown AppArmor userns restriction value'
              subprocess.run(['sudo', '-n', 'sysctl', '-w', 'kernel.apparmor_restrict_unprivileged_userns=0'], check=True)
              after = key.read_text().strip()
              print('DEZIRCLIP_USERNS_PREREQUISITE', {'before': before, 'after': after}, flush=True)
              assert after == '0', 'User namespace prerequisite readback failed'
          # Retain this run's original values for the final native step.
          identity = {name: os.environ[name] for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_SHA', 'RUNNER_NAME', 'RUNNER_ARCH')}
          assert re.fullmatch('[1-9][0-9]*', identity['GITHUB_RUN_ID']) and re.fullmatch('[1-9][0-9]*', identity['GITHUB_RUN_ATTEMPT']) and re.fullmatch('[A-Za-z0-9_-]+', identity['GITHUB_JOB']) and re.fullmatch('[0-9a-f]{40}', identity['GITHUB_SHA']), 'Invalid native job identity'
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-userns-' + identity['GITHUB_RUN_ID'] + '-' + identity['GITHUB_RUN_ATTEMPT'] + '-' + identity['GITHUB_JOB'] + '.json')
          with receipt.open('x', encoding='utf-8') as output:
              json.dump({'schema_version': 1, 'status': 'passed', 'identity': identity, 'key_exists': key.exists(), 'before': before, 'after': after}, output)
              output.flush()
              os.fsync(output.fileno())

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libwebkitgtk-6.0-4 gir1.2-atspi-2.0 python3-gi at-spi2-core xvfb xauth xclip x11-utils openbox pulseaudio pulseaudio-utils dbus-x11 gnome-keyring tesseract-ocr tesseract-ocr-eng ffmpeg \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libpipewire-0.3-dev \
            libgbm-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxtst-dev \
            libdbus-1-dev \
            bubblewrap \
            xdg-utils fonts-noto-cjk

      - name: Install Rust stable
        if: matrix.rust_target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify Cargo helper ownership and bundle configuration
        run: node scripts/check-desktop-companions.mjs

      - name: Setup MSVC ARM64 toolchain
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Limit Linux x64 CI debug data and record disk before cache
        if: runner.os == 'Linux' && runner.arch == 'X64' && matrix.name == 'linux-x86_64'
        shell: python
        run: |
          import json, os, pathlib, re, shutil, subprocess, sys
          assert sys.platform == 'linux' and os.environ.get('RUNNER_ARCH') == 'X64'
          assert os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          assert os.environ.get('GITHUB_REPOSITORY') == 'qiyuanhuakai/dezirclip' and os.environ.get('GITHUB_JOB') == 'tauri'
          source = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source), 'Immutable CI checkout required'
          workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          temporary = pathlib.Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          assert workspace.is_dir() and temporary.is_dir() and workspace == pathlib.Path.cwd().resolve(strict=True)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=workspace, text=True, timeout=10).strip() == source
          def usage(root):
              disk, inode = shutil.disk_usage(root), os.statvfs(root)
              return {'bytes_total': disk.total, 'bytes_used': disk.used, 'bytes_free': disk.free,
                      'inodes_total': inode.f_files, 'inodes_free': inode.f_ffree, 'inodes_available': inode.f_favail}
          value = {'stage': 'before-cache', 'source_revision': source,
                   'workspace': usage(workspace), 'runner_temp': usage(temporary)}
          encoded = json.dumps(value, sort_keys=True)
          assert len(encoded.encode('ascii')) <= 2048, 'Bounded disk summary required'
          environment = pathlib.Path(os.environ['GITHUB_ENV'])
          assert environment.is_file() and not environment.is_symlink() and environment.resolve(strict=True).is_relative_to(temporary)
          with environment.open('a', encoding='utf-8', newline='\n') as output:
              output.write('CARGO_PROFILE_DEV_DEBUG=0\nCARGO_PROFILE_TEST_DEBUG=0\n')
          print('DEZIRCLIP_CI_DISK', encoded, flush=True)

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          # A cache saved on a release tag cannot be reused by the next tag.
          save-if: ${{ needs.ci-desktop-plan.outputs.mode != 'source-acceptance' || github.ref_type != 'tag' }}
          cache-on-failure: true

      - name: Setup Go for local IPC compatibility
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            clients/go/go.sum
            frontends/dzc-surface/go.sum

      - name: Setup pnpm for native Surface acceptance
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js for Surface builds
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies for Surface tokens
        run: pnpm install --frozen-lockfile

      - name: Prepare actual frontend for native Surface acceptance
        if: matrix.build_web
        run: pnpm run build

      - name: Test Go local protocol client
        if: matrix.name == 'linux-aarch64'
        working-directory: clients/go
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Test experimental Surface control and selection
        if: matrix.name == 'linux-aarch64'
        working-directory: frontends/dzc-surface
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          DZC_VISUAL_DIR: ${{ github.workspace }}/target/native-visual-review
        run: go test -count=1 ./...

      - name: Upload native panel visual fixtures
        if: matrix.name == 'linux-aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: Native-panel-visuals-${{ matrix.name }}-${{ github.sha }}
          path: target/native-visual-review/*.png
          if-no-files-found: error

      - name: Build experimental Surface with matching source identity
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_target }}
