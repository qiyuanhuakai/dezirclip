name: CI

on:
  push:
    branches:
      - master
  # No base filter on purpose. A stacked PR (base = another feature branch) used
  # to report no checks at all, which is indistinguishable from passing and
  # leaves the branch unverified until the stack is merged. Every PR now runs the
  # same suite regardless of what it is stacked on.
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DEZIRCLIP_DISABLE_LINUX_SERVICES: window_tracker,edge_docking,mouse_hotkey

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n keys
        run: pnpm run i18n:check

      - name: Check theme CSS contracts
        run: node scripts/audit-theme-css.mjs --check

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Build frontend
        run: pnpm run build

  tauri:
    name: Tauri backend (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-24.04
            cargo_args: ''
            rust_target: ''
            msvc_arch: ''
            can_test: true
          - name: linux-aarch64
            platform: ubuntu-24.04-arm
            cargo_args: ''
            rust_target: ''
            msvc_arch: ''
            can_test: true
          - name: windows-x86_64
            platform: windows-latest
            cargo_args: ''
            rust_target: ''
            msvc_arch: ''
            can_test: true
          - name: windows-aarch64
            platform: windows-latest
            cargo_args: --target aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            can_test: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check src-tauri/src/bin layout
        run: node scripts/check-tauri-bin-dir.mjs

      - name: Setup Python for archive validation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test standalone packaging
        run: python -m unittest discover -s scripts/tests -v

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libpipewire-0.3-dev \
            libgbm-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxtst-dev \
            libdbus-1-dev \
            xdg-utils

      - name: Install Rust stable
        if: matrix.rust_target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup MSVC ARM64 toolchain
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Test Tauri crate
        if: matrix.can_test
        working-directory: src-tauri
        # --all-targets so `examples/` is covered too. `cargo test` only builds
        # examples, it does not run their tests, and backup-inspect moved out of
        # src/bin (to keep it out of the installers) into examples/ — without
        # this flag its 15 tests silently stop running.
        run: cargo test --all-targets

      - name: Build Tauri crate
        working-directory: src-tauri
        run: cargo build ${{ matrix.cargo_args }}

      - name: Check backend without replacing the built CLI
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shlex
          import subprocess
          binary = Path(os.environ["GITHUB_WORKSPACE"]) / "src-tauri" / "target"
          target = "${{ matrix.rust_target }}"
          if target:
              binary /= target
          binary = binary / "debug" / ("dzc.exe" if os.name == "nt" else "dzc")
          before = hashlib.sha256(binary.read_bytes()).digest()
          subprocess.run([
              "cargo", "check", "--manifest-path", "src-tauri/Cargo.toml", "--all-targets",
              *shlex.split("${{ matrix.cargo_args }}"),
          ], check=True)
          if hashlib.sha256(binary.read_bytes()).digest() != before:
              raise RuntimeError("backend check replaced the built CLI")

  standalone-cli:
    name: Compatible standalone CLI
    uses: ./.github/workflows/standalone-cli.yml

  flatpak:
    name: Verified Flatpak
    uses: ./.github/workflows/flatpak.yml
