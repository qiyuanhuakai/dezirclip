          DEZIRCLIP_DISABLE_LINUX_SERVICES=window_tracker,edge_docking /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --idle
          /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --paste-hotkeys
          DEZIRCLIP_DISABLE_LINUX_SERVICES=window_tracker,edge_docking /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --middle-paste-hotkeys
          /usr/bin/python3 scripts/tests/mygo-desktop-x11.py target/debug/dzc-desktop --reset-settings
