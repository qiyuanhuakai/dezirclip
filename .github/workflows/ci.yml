          binary = Path("target/debug") / ("dzc-service.exe" if os.name == "nt" else "dzc-service")
          os.environ["DZC_TEST_SERVICE"] = str(binary.resolve(strict=True))
          name = "desktop_protocol_tests::installed_service_serves_desktop_tools_without_a_webview"
          result = subprocess.run(["cargo", "test", "--locked", "-p", "dzc-service", "--features", "native-screen",
                                   "--lib", name, "--", "--ignored", "--exact"], text=True, stdout=subprocess.PIPE)
          print(result.stdout)
          result.check_returncode()
          if f"test {name} ... ok" not in result.stdout:
              raise SystemExit("The Service fixture was selected but did not pass")

      - name: Retain real CLI and MCP host acceptance
        if: always() && (steps.local-service.outcome == 'success' || steps.local-service.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: local-clients-${{ matrix.name }}-${{ github.run_attempt }}
