name: Windows release upgrade probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build current native desktop with published sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = "$env:RUNNER_TEMP/beta5-mygo.exe"
          curl.exe -fsSL 'https://github.com/qiyuanhuakai/dezirclip/releases/download/v0.2.0-beta.5/DezirClip-v0.2.0-beta.5-windows-x64-MyGo-setup.exe' -o $source
          $stage = "$env:RUNNER_TEMP/probe-stage"
          & 'C:/Program Files/7-Zip/7z.exe' x $source "-o$stage" '-ir!dzc*.exe' '-ir!skills\*' -y
          $env:CGO_ENABLED='0'
          $identity='github.com/qiyuanhuakai/dezirclip/frontends/dzc-surface/internal/buildinfo'
          $revision='94f49244ac1012ae13cc1c0e731239b414bac318'
          $version='0.2.0-beta.5'
          $toolkit=(Get-Content frontends/dzc-surface/internal/buildinfo/mygo-toolkit.json -Raw | ConvertFrom-Json).id
          $flags="-H windowsgui -X $identity.Version=$version -X $identity.SourceRevision=$revision -X $identity.SourceState=verified_checkout -X $identity.BuildID=$version@$revision -X $identity.Target=x86_64-pc-windows-msvc -X $identity.ToolkitPatch=$toolkit"
          Push-Location frontends/dzc-surface
          try {
            go build -trimpath -ldflags $flags -o "$stage/dzc-desktop.exe" ./cmd/dzc-desktop
          } finally {
            Pop-Location
          }
          choco install nsis --no-progress -y
      - name: Exercise the installed native desktop and trace the installer
        shell: bash
        run: |
          set -euo pipefail
          export DZC_INSTALL_PROBE_TRACE="$RUNNER_TEMP/probe-trace.txt"
          export DZC_INSTALL_PROBE_STAGE="$RUNNER_TEMP/probe-stage"
          export DZC_INSTALL_PROBE_INSTALLER="$RUNNER_TEMP/DezirClip-native-handoff-probe.exe"
          trap 'if [[ -f "$DZC_INSTALL_PROBE_TRACE" ]]; then cat "$DZC_INSTALL_PROBE_TRACE"; fi' EXIT
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          stage = Path(os.environ["DZC_INSTALL_PROBE_STAGE"])
          installer = Path(os.environ["DZC_INSTALL_PROBE_INSTALLER"])
          runpy.run_path("scripts/build-mygo-installer.py")["build"](stage, installer, "0.2.0-beta.6", fast_compression=True)
          runpy.run_path("scripts/tests/mygo-installer-windows.py")["verify"](installer, stage, native_main=True, focused=True)
          PY
