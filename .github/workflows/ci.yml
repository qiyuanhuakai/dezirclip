name: Windows release upgrade probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 8
      DZC_BUILD_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: release-thin-lto-windows-x86_64
      - name: Build the actual release desktop and sidecars
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = "$env:RUNNER_TEMP/beta5-mygo.exe"
          curl.exe -fsSL 'https://github.com/qiyuanhuakai/dezirclip/releases/download/v0.2.0-beta.5/DezirClip-v0.2.0-beta.5-windows-x64-MyGo-setup.exe' -o $source
          $stage = "$env:RUNNER_TEMP/probe-stage"
          & 'C:/Program Files/7-Zip/7z.exe' x $source "-o$stage" '-ir!dzc*.exe' '-ir!skills\*' -y
          pnpm install --frozen-lockfile
          pnpm run desktop:mygo:build --target x86_64-pc-windows-msvc
          cargo build --locked --release --no-default-features --features native-screen --bin dzc --bin dzc-service --target x86_64-pc-windows-msvc
          Copy-Item -LiteralPath 'artifacts/dzc-desktop/x86_64-pc-windows-msvc/dzc-desktop.exe' -Destination $stage
          Copy-Item -LiteralPath 'target/x86_64-pc-windows-msvc/release/dzc.exe','target/x86_64-pc-windows-msvc/release/dzc-service.exe' -Destination $stage
          $nsis = "$env:RUNNER_TEMP/nsis-3.13.zip"
          curl.exe -fsSL 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' -o $nsis
          Expand-Archive -LiteralPath $nsis -DestinationPath "$env:RUNNER_TEMP/nsis"
          (Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/nsis" -Recurse -Filter makensis.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - name: Exercise the installed native desktop and trace the installer
        shell: bash
        run: |
          set -euo pipefail
          export DZC_INSTALL_PROBE_TRACE="$RUNNER_TEMP/probe-trace.txt"
          export DZC_INSTALL_PROBE_STAGE="$RUNNER_TEMP/probe-stage"
          export DZC_INSTALL_PROBE_INSTALLER="$RUNNER_TEMP/DezirClip-native-handoff-probe.exe"
          trap 'trace=$(cygpath -u "$DZC_INSTALL_PROBE_TRACE"); if [[ -f "$trace" ]]; then cat "$trace"; fi' EXIT
          python - <<'PY'
          import os, runpy
          from pathlib import Path
          stage = Path(os.environ["DZC_INSTALL_PROBE_STAGE"])
          installer = Path(os.environ["DZC_INSTALL_PROBE_INSTALLER"])
          runpy.run_path("scripts/build-mygo-installer.py")["build"](stage, installer, "0.2.0-beta.6", fast_compression=True)
          runpy.run_path("scripts/tests/mygo-installer-windows.py")["verify"](installer, stage, native_main=True, focused=True)
          PY
