      - name: Verify MyGo React library operations against the Rust Service
        id: mygo_library
        if: matrix.can_test
        env:
          CGO_ENABLED: '0'
        shell: python
        run: |
          import json, os, subprocess
          from pathlib import Path
          fixture = Path("target/debug", "mygo-library.test" + (".exe" if os.name == "nt" else "")).resolve()
          version = json.loads(Path("package.json").read_text(encoding="utf-8"))["version"]
          subprocess.run(["go", "test", "-c", "-o", str(fixture), "./cmd/dzc-desktop"], cwd="frontends/dzc-surface", check=True)
          command = [fixture, "-test.run=^(TestReactLibraryWithService|TestBundledUpdateChannels|TestDesktopServiceShutdown)$", "-test.v", "-test.timeout=90s"]
          environment = {**os.environ, "DZC_TEST_LIBRARY_VERSION": version}
          if os.name == "nt":
              subprocess.run(command, env=environment, check=True)
          else:
              environment["DZC_TEST_REQUIRE_OCR"] = "1"
              subprocess.run(["cargo", "build", "--locked", "-p", "dzc-platform", "--example", "release_receipt_preseed"], check=True)
              evidence = Path(os.environ["RUNNER_TEMP"]) / "mygo-library-keyring"
              result = subprocess.run(["python", "scripts/release_identity_secret_service.py", "--temporary-profile",
                  "--helper", "target/debug/examples/release_receipt_preseed", "--output", evidence, "--", *command], env=environment)
              for name in ("command.stdout.log", "command.stderr.log"):
                  log = evidence / name
