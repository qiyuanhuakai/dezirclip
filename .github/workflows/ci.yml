          import subprocess
          binary = Path("target/debug") / ("dzc.exe" if os.name == "nt" else "dzc")
          fixture = binary.with_name("dzc-desktop-fixture" + binary.suffix).resolve()
          subprocess.run(["go", "build", "-o", str(fixture), "./cmd/host-fixture"], cwd="clients/go", check=True)
          subprocess.run(["python", "scripts/test-local-host.py", "--cli", str(binary), "--desktop-fixture", str(fixture)], check=True)
          report = Path(os.environ["RUNNER_TEMP"]) / "local-clients.json"
          subprocess.run(["python", "scripts/test-local-clients.py", "--cli", str(binary), "--report", str(report)], check=True)

      - name: Install Schema 24 fixture dependencies
        if: matrix.can_test
        shell: python
        run: |
          import subprocess, sys
          installer = ["uv", "pip", "install", "--python", sys.executable] if sys.platform == "linux" else [
              sys.executable, "-m", "pip", "install", "--disable-pip-version-check"
          ]
          subprocess.run([*installer, "Pillow==13.0.0", "psutil==7.2.2"], check=True)

      - name: Verify the built CLI identity and Schema 24 writes
        if: matrix.can_test
        shell: python
        run: |
          import os, sys, unittest
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          binary = Path("target/debug") / ("dzc.exe" if os.name == "nt" else "dzc")
          os.environ["DZC_TEST_BIN"] = str(binary.resolve(strict=True))
          tests = unittest.defaultTestLoader.loadTestsFromNames([
              "scripts.tests.test_build_info.CliBuildInfoTests",
              "scripts.tests.test_sqlite_history_fixture.SchemaTwentyFourWriterTests",
              "scripts.tests.test_sqlite_history_fixture.SyntheticSeederTests.test_direct_sqlite_fixture_stays_deterministic_for_legacy_and_schema24",
          ])
          result = unittest.TextTestRunner(verbosity=2).run(tests)
          if result.testsRun < 3 or result.skipped or not result.wasSuccessful():
