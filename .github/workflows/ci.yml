        if: "!matrix.can_test || (runner.os == 'Linux' && needs.ci-desktop-plan.outputs.mode != 'source-acceptance')"
        run: python -B scripts/ci_desktop_binaries.py protect cargo build --locked --manifest-path src-tauri/Cargo.toml ${{ matrix.cargo_args }}

      - name: Verify optional local service without native capture
        id: local-service
        if: matrix.can_test
        shell: python
        run: |
