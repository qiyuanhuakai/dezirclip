name: CI

on:
  push:
    branches:
      - master
  # No base filter on purpose. A stacked PR (base = another feature branch) used
  # to report no checks at all, which is indistinguishable from passing and
  # leaves the branch unverified until the stack is merged. Every PR now runs the
  # same suite regardless of what it is stacked on.
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DZC_BUILD_REVISION: ${{ github.sha }}
  DEZIRCLIP_DISABLE_LINUX_SERVICES: window_tracker,edge_docking,mouse_hotkey

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check i18n keys
        run: pnpm run i18n:check

      - name: Check synchronized release versions
        run: pnpm run release:set-version --check

      - name: Check shared Surface design tokens
        run: pnpm run surface:tokens --check

      - name: Test independent Surface build identity
        run: node --test scripts/tests/surface-build.node.mjs scripts/tests/mygo-surface-patch.node.mjs

      - name: Test disposable native Surface fixture contracts
        run: node --test scripts/tests/native-windows-surface.node.mjs scripts/tests/native-windows-crash-events.node.mjs

      - name: Check single-source local protocol generation
        run: python scripts/generate-protocol.py --check

      - name: Test updater release gates
        run: node --test scripts/tests/set-release-version.node.mjs scripts/tests/updater-release.node.mjs scripts/tests/release-windows-upgrade.node.mjs

      - name: Check final Windows upgrade source boundary
        run: python -I -B scripts/tests/release-windows-upgrade-ps.py

      - name: Check theme CSS contracts
        run: node scripts/audit-theme-css.mjs --check

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Build frontend
        run: pnpm run build

  tauri:
    name: Tauri backend (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            platform: ubuntu-24.04
            cargo_args: ''
            rust_target: ''
            msvc_arch: ''
            can_test: true
          - name: linux-aarch64
            platform: ubuntu-24.04-arm
            cargo_args: ''
            rust_target: ''
            msvc_arch: ''
            can_test: true
          - name: windows-x86_64
            platform: windows-latest
            cargo_args: ''
            rust_target: ''
            msvc_arch: ''
            can_test: true
          - name: windows-aarch64
            platform: windows-latest
            cargo_args: --target aarch64-pc-windows-msvc
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: amd64_arm64
            can_test: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check src-tauri/src/bin layout
        run: node scripts/check-tauri-bin-dir.mjs

      - name: Verify the active Explorer prerequisite for final release upgrades
        if: matrix.name == 'windows-x86_64'
        shell: pwsh
        run: |
          $processes = @(Get-Process explorer -ErrorAction SilentlyContinue)
          try {
            $original = @($processes | ForEach-Object { @{ pid = $_.Id; started_at = $_.StartTime.ToUniversalTime().ToString('o') } })
            ConvertTo-Json -InputObject $original -Depth 4
            if ($original.Count -eq 0) { throw 'Final release upgrade acceptance requires an active original Explorer; an empty process set cannot prove preservation.' }
          } finally { foreach ($process in $processes) { $process.Dispose() } }

      - name: Setup Python for archive validation
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup standalone Python for Linux SQLite fixtures
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        env:
          UV_MANAGED_PYTHON: '1'
        with:
          version: '0.13.3'
          python-version: '3.13.15'
          activate-environment: true
          venv-path: ${{ runner.temp }}/dezirclip-fixture-python
          enable-cache: false

      - name: Require compatible SQLite for synthetic FTS5 fixtures
        run: >-
          python -c "import sqlite3; print('Fixture SQLite', sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 50, 4), 'Synthetic schema20 fixtures require SQLite >=3.50.4'; connection=sqlite3.connect(':memory:'); connection.execute('CREATE VIRTUAL TABLE fixture_fts USING fts5(content)'); connection.close()"

      - name: Permit private user namespaces on disposable Linux runner
        if: runner.os == 'Linux'
        shell: python
        run: |
          import json, os, pathlib, re, subprocess, sys
          assert sys.platform == 'linux' and os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted', 'Only a disposable Actions Linux runner may configure this prerequisite'
          # Ubuntu 24.04 mediates capabilities within unprivileged user namespaces:
          # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
          key = pathlib.Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          print('DEZIRCLIP_USERNS_PREREQUISITE', {'key_exists': key.exists(), 'apparmor_label': pathlib.Path('/proc/self/attr/current').read_text().strip()}, flush=True)
          before = after = None
          if key.exists():
              before = key.read_text().strip()
              assert before in ('0', '1'), 'Unknown AppArmor userns restriction value'
              subprocess.run(['sudo', '-n', 'sysctl', '-w', 'kernel.apparmor_restrict_unprivileged_userns=0'], check=True)
              after = key.read_text().strip()
              print('DEZIRCLIP_USERNS_PREREQUISITE', {'before': before, 'after': after}, flush=True)
              assert after == '0', 'User namespace prerequisite readback failed'
          # Retain this run's original values for the final native step.
          identity = {name: os.environ[name] for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_SHA', 'RUNNER_NAME', 'RUNNER_ARCH')}
          assert re.fullmatch('[1-9][0-9]*', identity['GITHUB_RUN_ID']) and re.fullmatch('[1-9][0-9]*', identity['GITHUB_RUN_ATTEMPT']) and re.fullmatch('[A-Za-z0-9_-]+', identity['GITHUB_JOB']) and re.fullmatch('[0-9a-f]{40}', identity['GITHUB_SHA']), 'Invalid native job identity'
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-userns-' + identity['GITHUB_RUN_ID'] + '-' + identity['GITHUB_RUN_ATTEMPT'] + '-' + identity['GITHUB_JOB'] + '.json')
          with receipt.open('x', encoding='utf-8') as output:
              json.dump({'schema_version': 1, 'status': 'passed', 'identity': identity, 'key_exists': key.exists(), 'before': before, 'after': after}, output)
              output.flush()
              os.fsync(output.fileno())

      - name: Test standalone packaging
        run: python -m unittest discover -s scripts/tests -v

      - name: Test fixed release recovery guard
        run: python -I -B -m unittest discover -s scripts -p test_release_recovery.py -v

      - name: Test performance build provenance
        run: python -m unittest discover -s scripts/performance/tests -v

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libpipewire-0.3-dev \
            libgbm-dev \
            libx11-dev \
            libxi-dev \
            libxrandr-dev \
            libxtst-dev \
            libdbus-1-dev \
            bubblewrap \
            xdg-utils

      - name: Install Rust stable
        if: matrix.rust_target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust stable with target
        if: matrix.rust_target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Setup MSVC ARM64 toolchain
        if: matrix.msvc_arch != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Setup Go for local IPC compatibility
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            clients/go/go.sum
            frontends/dzc-surface/go.sum

      - name: Setup pnpm for native Surface acceptance
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js for Surface builds
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare actual frontend for native Surface acceptance
        if: matrix.can_test
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test Go local protocol client
        if: matrix.can_test
        working-directory: clients/go
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Test experimental Surface control and selection
        if: matrix.can_test
        working-directory: frontends/dzc-surface
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: go test ./...

      - name: Build experimental Surface with matching source identity
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust_target }}
          GOTOOLCHAIN: local
        run: pnpm run surface:build

      - name: Test bounded native local IPC
        if: matrix.can_test
        run: |
          cargo test -p dzc-protocol --features wire
          cargo test -p dzc-platform --features ipc ipc::
          cargo build -p dzc-platform --features ipc --example ipc_protocol_fixture

      - name: Verify native Rust and Go protocol compatibility
        if: matrix.can_test
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          fixture = Path("target/debug/examples") / ("ipc_protocol_fixture.exe" if os.name == "nt" else "ipc_protocol_fixture")
          subprocess.run(["python", "scripts/test-local-ipc.py", "--rust-fixture", str(fixture), "--go", shutil.which("go")], check=True)
          subprocess.run(["python", "scripts/test-capture-lease.py", "--fixture", str(fixture)], check=True)

      - name: Test Tauri crate
        if: matrix.can_test
        working-directory: src-tauri
        # --all-targets so `examples/` is covered too. `cargo test` only builds
        # examples, it does not run their tests, and backup-inspect moved out of
        # src/bin (to keep it out of the installers) into examples/ — without
        # this flag its 15 tests silently stop running.
        run: cargo test --workspace --all-targets

      - name: Build Tauri crate
        working-directory: src-tauri
        run: cargo build ${{ matrix.cargo_args }}

      - name: Verify optional local service without native capture
        if: matrix.can_test
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          subprocess.run(["cargo", "build", "--locked", "--no-default-features", "--bin", "dzc", "--bin", "dzc-service"], check=True)
          binary = Path("target/debug") / ("dzc.exe" if os.name == "nt" else "dzc")
          subprocess.run(["python", "scripts/test-local-host.py", "--cli", str(binary)], check=True)

      - name: Verify private Windows clipboard leases on disposable runner
        if: runner.os == 'Windows' && matrix.can_test
        env:
          DZC_PRIVATE_LEASE_DISPOSABLE: '1'
          DZC_PRIVATE_LEASE_DIAGNOSTICS: '1'
          DZC_PRIVATE_OWNER_FIXTURE_EXE: ${{ github.workspace }}/target/debug/dzc.exe
          RUST_BACKTRACE: '1'
        run: cargo test -p dzc-platform --features ipc native_clipboard::private_windows::tests::disposable_native_ -- --ignored --nocapture --test-threads=1

      - name: Check backend without replacing the built CLI
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shlex
          import subprocess
          binary = Path(os.environ["GITHUB_WORKSPACE"]) / "target"
          target = "${{ matrix.rust_target }}"
          if target:
              binary /= target
          binary = binary / "debug" / ("dzc.exe" if os.name == "nt" else "dzc")
          before = hashlib.sha256(binary.read_bytes()).digest()
          subprocess.run([
              "cargo", "check", "--manifest-path", "src-tauri/Cargo.toml", "--all-targets",
              *shlex.split("${{ matrix.cargo_args }}"),
          ], check=True)
          if hashlib.sha256(binary.read_bytes()).digest() != before:
              raise RuntimeError("backend check replaced the built CLI")

      - name: Build actual Windows desktop with embedded frontend for Surface acceptance
        if: runner.os == 'Windows' && matrix.can_test
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features tauri/custom-protocol --bin dezirclip

      - name: Verify experimental Surface on disposable Windows desktop
        if: runner.os == 'Windows' && matrix.can_test
        shell: python
        run: |
          import os, pathlib, subprocess, sys, uuid
          assert sys.platform == 'win32' and os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-surface-' + uuid.uuid4().hex)
          helper = pathlib.Path('artifacts/dzc-surface/x86_64-pc-windows-msvc/dzc-surface.exe')
          subprocess.run(['node', 'scripts/tests/native-windows-surface.mjs',
              '--desktop', 'target/debug/dezirclip.exe', '--helper', str(helper),
              '--helper-proof', str(helper) + '.proof.json', '--python', sys.executable,
              '--output-root', str(root)], check=True)

      - name: Preserve original Windows Surface observations
        if: always() && runner.os == 'Windows' && matrix.can_test
        uses: actions/upload-artifact@v4
        with:
          name: native-surface-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dezirclip-surface-*/*.json
            ${{ runner.temp }}/dezirclip-surface-*/*.log
            ${{ runner.temp }}/dezirclip-surface-*/*.png
            !${{ runner.temp }}/dezirclip-surface-*/profile/**
            !${{ runner.temp }}/dezirclip-surface-*/webview/**
            !${{ runner.temp }}/dezirclip-surface-*/environment/**
            !${{ runner.temp }}/dezirclip-surface-*/candidate/**
          if-no-files-found: warn

      - name: Verify actual private Linux release receipt mounts
        if: runner.os == 'Linux'
        shell: python
        run: |
          import json, os, pathlib, shutil, subprocess, sys
          assert sys.platform == 'linux' and os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted' and shutil.which('bwrap'), 'Actual bubblewrap execution on the disposable Linux runner is required'
          identity = {name: os.environ[name] for name in ('GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_SHA', 'RUNNER_NAME', 'RUNNER_ARCH')}
          receipt = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-userns-' + identity['GITHUB_RUN_ID'] + '-' + identity['GITHUB_RUN_ATTEMPT'] + '-' + identity['GITHUB_JOB'] + '.json')
          assert receipt.is_file() and not receipt.is_symlink() and receipt.stat().st_size <= 8192, 'Original bounded userns receipt is missing'
          saved = json.loads(receipt.read_text(encoding='utf-8'))
          assert type(saved['schema_version']) is int and saved['schema_version'] == 1 and saved['status'] == 'passed' and saved['identity'] == identity, 'Original userns receipt belongs to another run/attempt/job'
          key = pathlib.Path('/proc/sys/kernel/apparmor_restrict_unprivileged_userns')
          assert type(saved['key_exists']) is bool and saved['key_exists'] == key.exists(), 'Userns prerequisite availability changed'
          current = key.read_text().strip() if key.exists() else None
          assert (saved['before'] in ('0', '1') and saved['after'] == current == '0') if key.exists() else saved['before'] is saved['after'] is current is None, 'Userns prerequisite no longer matches its original readback'
          print('DEZIRCLIP_USERNS_PREREQUISITE_RETAINED', {'original': saved, 'current': current}, flush=True)
          subprocess.run([sys.executable, '-I', '-B', 'scripts/tests/test_release_identities.py', 'ReleaseIdentities.test_real_readonly_directory_requires_the_nested_file_mountpoint', '-v'], check=True)

  standalone-cli:
    name: Compatible standalone CLI
    uses: ./.github/workflows/standalone-cli.yml

  native-windows-upgrade:
    name: Native NSIS (${{ matrix.scenario }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario: [LegacyUninstall, OldToNew, PublishedAlphaToAlpha, OwnedUpgrade, OwnedExternalEdit, DeniedGuiUpgrade]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: matrix.scenario != 'LegacyUninstall'
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup native clipboard fixture runtime
        if: matrix.scenario != 'LegacyUninstall'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.15'

      - name: Check disposable native clipboard boundary
        if: matrix.scenario != 'LegacyUninstall'
        run: python -m unittest discover -s scripts/tests -p test_native_windows_clipboard.py

      - name: Test sidecar packaging contracts
        run: node --test scripts/tests/packaging-sidecars.node.mjs

      - name: Test packaging proof and process identity decisions
        shell: pwsh
        run: |
          ./scripts/tests/native-packaging-proof.ps1
          ./scripts/tests/native-process-identity.ps1
          ./scripts/tests/native-build-info.ps1
          ./scripts/tests/native-installer-outcomes.ps1

      - name: Install Rust stable
        if: matrix.scenario != 'LegacyUninstall'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        if: matrix.scenario != 'LegacyUninstall'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-debug-installers

      - name: Install frontend dependencies
        if: matrix.scenario != 'LegacyUninstall'
        run: pnpm install --frozen-lockfile

      - name: Download pinned published legacy installer
        if: matrix.scenario == 'LegacyUninstall' || matrix.scenario == 'OldToNew'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/qiyuanhuakai/dezirclip/releases/download/v0.1.20/DezirClip_0.1.20_x64-setup.exe' -OutFile "$env:RUNNER_TEMP/legacy-setup.exe"

      - name: Download pinned published alpha.1 installer
        if: matrix.scenario == 'PublishedAlphaToAlpha'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/qiyuanhuakai/dezirclip/releases/download/v0.2.0-alpha.1/DezirClip_0.2.0-alpha.1_x64-setup.exe' -OutFile "$env:RUNNER_TEMP/legacy-setup.exe"

      - name: Build previous unpublished fixture package
        if: matrix.scenario == 'OwnedUpgrade'
        shell: pwsh
        run: ./scripts/build-native-windows-fixture.ps1 -Version 0.2.0-alpha.1 -Destination "$env:RUNNER_TEMP/previous-setup.exe"

      - name: Build current unpublished fixture package
        if: matrix.scenario != 'LegacyUninstall'
        shell: pwsh
        run: ./scripts/build-native-windows-fixture.ps1 -Version 0.2.0-alpha.2 -Destination "$env:RUNNER_TEMP/candidate-setup.exe"

      - name: Exercise actual installer and application
        shell: pwsh
        run: |
          ./scripts/test-native-windows-upgrade.ps1 -Scenario '${{ matrix.scenario }}' -OldInstaller "$env:RUNNER_TEMP/legacy-setup.exe" -NewInstaller "$env:RUNNER_TEMP/candidate-setup.exe" -PreviousCandidate "$env:RUNNER_TEMP/previous-setup.exe"

      - name: Preserve isolated acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-nsis-${{ matrix.scenario }}
          path: ${{ runner.temp }}/dezirclip-upgrade-*/
          if-no-files-found: ignore

  flatpak:
    name: Verified Flatpak
    uses: ./.github/workflows/flatpak.yml
