        if: runner.os == 'Windows' && matrix.can_test
        env:
          DZC_PRIVATE_LEASE_DISPOSABLE: '1'
          DZC_PRIVATE_LEASE_DIAGNOSTICS: '1'
          DZC_PRIVATE_OWNER_FIXTURE_EXE: ${{ github.workspace }}/target/debug/dzc.exe
          RUST_BACKTRACE: '1'
        run: cargo test -p dzc-platform --features ipc native_clipboard::private_windows::tests::disposable_native_ -- --ignored --nocapture --test-threads=1

      - name: Check cross-built Tauri targets preserving standalone companions
        if: '!matrix.can_test'
        run: python -B scripts/ci_desktop_binaries.py protect cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets ${{ matrix.cargo_args }}

      - name: Verify experimental Surface on disposable Windows desktop
        if: runner.os == 'Windows' && matrix.can_test
        timeout-minutes: 12
        env:
          DZC_TESTED_TAURI_SHA256: ${{ steps.tauri-tests.outputs.desktop_sha256 }}
        shell: python
        run: |
          import hashlib, os, pathlib, sys, uuid
          sys.path.insert(0, 'scripts/tests')
          from native_windows_supervisor import run_controller
          assert sys.platform == 'win32' and os.environ.get('GITHUB_ACTIONS') == 'true' and os.environ.get('RUNNER_ENVIRONMENT') == 'github-hosted'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / ('dezirclip-surface-' + uuid.uuid4().hex)
          helper = pathlib.Path('artifacts/dzc-surface/x86_64-pc-windows-msvc/dzc-surface.exe')
          with pathlib.Path('target/debug/dezirclip.exe').open('rb') as desktop:
              measured = hashlib.file_digest(desktop, 'sha256').hexdigest()
          if measured != os.environ.get('DZC_TESTED_TAURI_SHA256'):
              raise SystemExit('The Windows desktop differs from the executable produced by the Tauri tests')
          print(f'Tauri test executable SHA-256: {measured}', flush=True)
          sys.exit(run_controller(['node', 'scripts/tests/native-windows-surface.mjs',
              '--desktop', 'target/debug/dezirclip.exe', '--helper', str(helper),
              '--helper-proof', str(helper) + '.proof.json', '--python', sys.executable,
              '--output-root', str(root)], cwd=pathlib.Path.cwd(), output_root=root))

      - name: Preserve original Windows Surface observations
        if: always() && runner.os == 'Windows' && matrix.can_test
