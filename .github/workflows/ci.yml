        run: |
          pnpm run surface:build
          pnpm run desktop:mygo:build

      - name: Build the native local IPC interoperability fixture
        if: matrix.can_test
        run: cargo build --locked -p dzc-platform --features ipc --example ipc_protocol_fixture

      - name: Test shared Windows settings ownership and rollback
        if: matrix.can_test && runner.os == 'Windows'
        run: |
          cargo test --locked -p dzc-platform system_settings::

      - name: Verify shared Explorer restart on disposable Windows desktop
        if: matrix.can_test && runner.os == 'Windows'
        env:
          DZC_TEST_RESTART_EXPLORER: '1'
        run: |
          cargo test --locked -p dzc-platform system_settings::explorer_restart_on_disposable_runner -- --ignored --exact

      - name: Verify native Rust and Go protocol compatibility
        if: matrix.can_test
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          fixture = Path("target/debug/examples") / ("ipc_protocol_fixture.exe" if os.name == "nt" else "ipc_protocol_fixture")
          subprocess.run(["python", "scripts/test-local-ipc.py", "--rust-fixture", str(fixture), "--go", shutil.which("go")], check=True)
          subprocess.run(["python", "scripts/test-capture-lease.py", "--fixture", str(fixture)], check=True)

      - name: Test desktop tooling in its platform environment
        if: matrix.can_test
        run: python -B -m scripts.ci_contracts desktop

      - name: Build standalone CLI and Service for desktop acceptance
        run: python -B scripts/ci_desktop_binaries.py build

      - name: Test Tauri crate
        id: tauri-tests
        if: matrix.can_test
        shell: python
        # Include the standalone backup-inspect example alongside the backup integration suite.
        run: |
          import os, subprocess, sys
          command = [sys.executable, "-B", "scripts/ci_desktop_binaries.py", "protect",
                     "cargo", "test", "--locked", "--manifest-path", "src-tauri/Cargo.toml", "-p", "dezirclip", "--all-targets"]
          if sys.platform == "win32":
              command = [sys.executable, "-B", "scripts/ci_desktop_binaries.py", "test-windows-desktop"]
          if sys.platform == "linux":
              command = ["xvfb-run", "-a", *command]
              os.environ["XDG_SESSION_TYPE"] = "x11"
              os.environ.pop("WAYLAND_DISPLAY", None)
              os.environ.pop("WAYLAND_SOCKET", None)
          subprocess.run(command, check=True)

