[workspace]
members = ["src-tauri", "crates/dzc-core", "crates/dzc-platform", "crates/dzc-protocol"]
default-members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.21-beta.1"
edition = "2021"
authors = ["qiyuanhuakai"]

[workspace.dependencies]
dzc-core = { path = "crates/dzc-core" }
dzc-platform = { path = "crates/dzc-platform" }
dzc-protocol = { path = "crates/dzc-protocol" }
tauri-build = { version = "2", features = [] }
serde_json = "1"
tauri = { version = "2.11", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = { version = "2" }
tauri-plugin-updater = { version = "~2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
cssparser = "0.37"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
arboard = "3"
argon2 = "0.5"
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-dialog = { version = "2.7" }
tauri-plugin-global-shortcut = { version = "2.3.1" }
window-vibrancy = { version = "0.7.1" }
regex = "1.12.2"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"] }
unicode-width = { version = "0.2", default-features = false }
unicode-segmentation = "1.13.3"
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-window-state = { version = "2" }
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
machine-uid = { version = "0.5" }
sha2 = "0.10"
hex = "0.4"
dotenvy = { version = "0.15" }
dirs = "5.0"
qrcode2 = { version = "0.18" }
rand = "0.8"
xcap = { version = "0.9.6" }
zeroize = "1"
font-kit = { version = "0.14" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_UI_Accessibility", "Win32_UI_Input_Ime", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Media_Ocr", "Storage_Streams", "Globalization", "Graphics_Imaging"] }
windows-core = { version = "0.62" }
windows-future = { version = "0.3" }
windows-version = { version = "0.1.1" }
winreg = { version = "0.55.0" }
webview2-com = { version = "0.39.1" }
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest", "xfixes", "allow-unsafe-code"] }
x11-clipboard = { version = "0.9" }
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
# 启用 LTO (Link Time Optimization) - 可减少约 10-20% 体积
lto = true
# 使用单个 codegen unit，更好的优化但编译更慢
codegen-units = 1
# 优化级别：s = 优化大小，z = 更激进的大小优化
opt-level = "s"
# 移除符号表和调试信息
strip = true
# 启用 panic = abort 减少 unwinding 代码
panic = "abort"
