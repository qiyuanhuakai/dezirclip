[package]
name = "dzc-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native clipboard and key protection adapters for DezirClip"
publish = false

[[example]]
name = "ipc_protocol_fixture"
required-features = ["ipc"]

[features]
portable = ["dzc-core/portable"]
ipc = ["dep:tokio", "dzc-protocol/wire", "dep:sha2"]
native-screen = ["dep:xcap", "dep:zeroize"]
native-fonts = ["dep:font-kit", "dzc-protocol/wire"]
native-ocr = ["dep:windows-core"]

[dependencies]
tempfile = "3"
dunce = "1"
font-kit = { workspace = true, optional = true }
xcap = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
dzc-protocol.workspace = true
dzc-core.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
arboard.workspace = true
image.workspace = true
urlencoding.workspace = true
url = "2"
rand.workspace = true
aes-gcm.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
dirs.workspace = true
keyring.workspace = true
x11rb = { workspace = true, features = ["xkb"] }
libc.workspace = true
x11-clipboard.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
socket2 = "0.6"
dbus = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_System_Pipes", "Win32_Storage_FileSystem"] }
windows-core = { workspace = true, optional = true }
