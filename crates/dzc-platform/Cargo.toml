[package]
name = "dzc-platform"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Native clipboard and key protection adapters for DezirClip"
publish = false

[[example]]
name = "ipc_protocol_fixture"
required-features = ["ipc"]

[features]
portable = ["dzc-core/portable"]
ipc = ["dep:tokio", "dzc-protocol/wire", "dep:sha2", "dep:security-framework"]
native-screen = ["dep:xcap", "dep:zeroize", "x11rb/image"]
native-fonts = ["dep:font-kit", "dzc-protocol/wire"]
native-ocr = ["dep:windows-core", "windows/Win32_System_WinRT"]

[dependencies]
tempfile = "3"
dirs.workspace = true
dunce = "1"
font-kit = { workspace = true, optional = true }
xcap = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
dzc-protocol.workspace = true
dzc-core.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
base64.workspace = true
arboard.workspace = true
image.workspace = true
urlencoding.workspace = true
url = "2"
rand.workspace = true
aes-gcm.workspace = true
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util", "rt", "sync", "time", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
security-framework = { version = "3.7", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
keyring.workspace = true
x11rb = { workspace = true, features = ["randr", "xkb"] }
libc.workspace = true
x11-clipboard.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
socket2 = "0.6"
dbus = { version = "0.9", features = ["stdfd"] }

[target.'cfg(target_os = "windows")'.dependencies]
quick-xml = "0.39.4"
clipboard-win = "5.4.1"
winreg.workspace = true
windows = { workspace = true, features = ["ApplicationModel_DataTransfer", "Storage", "Win32_System_WinRT", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Kernel", "Win32_Media_MediaFoundation"] }
windows-collections = "0.3"
windows-core = { workspace = true, optional = true }
