[package]
name = "dzc-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Explicitly started current-user DezirClip Host service"
publish = false

[features]
native-screen = ["dzc-host/native-screen"]
portable = ["dzc-core/portable", "dzc-platform/portable"]

[build-dependencies]
tauri-winres = "0.3.6"

[dependencies]
dzc-core.workspace = true
dzc-platform = { workspace = true, features = ["ipc"] }
dzc-protocol = { workspace = true, features = ["wire"] }
dzc-host.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
clap.workspace = true
ctrlc.workspace = true
