[package]
name = "dezirclip"
version.workspace = true
description = "A local clipboard workspace"
authors.workspace = true
edition.workspace = true
default-run = "dezirclip"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop"]
desktop = [
    "dep:tauri", "dep:tauri-build", "dep:serde_json", "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state",
    "dep:window-vibrancy", "dep:machine-uid",
    "dep:dotenvy", "native-screen",
    "dep:windows-core", "dep:windows-future", "dep:windows-version",
    "dep:webview2-com", "dep:x11-clipboard", "dep:ksni", "dep:gtk",
    "dep:tauri-plugin-updater", "dep:reqwest", "dep:rustls",
    "dep:futures-util", "dep:http-body-util", "dep:hyper", "dep:hyper-util",
]
native-screen = ["dzc-host/native-screen"]
portable = ["dzc-core/portable", "dzc-platform/portable"]

[build-dependencies]
tauri-build = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dependencies]
dzc-core = { workspace = true, features = ["legacy-bridge"] }
dzc-platform.workspace = true
dzc-host.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
tauri-plugin-updater = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
semver.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
rusqlite = { workspace = true }

arboard = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "process", "io-util"] }
tauri-plugin-dialog = { workspace = true, optional = true }
tauri-plugin-global-shortcut = { workspace = true, optional = true }
window-vibrancy = { workspace = true, optional = true }

regex = { workspace = true }
tauri-plugin-single-instance = { workspace = true, optional = true }
tauri-plugin-window-state = { workspace = true, optional = true }
uuid = { workspace = true }
urlencoding = { workspace = true }
machine-uid = { workspace = true, optional = true }
sha2 = { workspace = true }
dotenvy = { workspace = true, optional = true }

zeroize = { workspace = true }

[[bin]]
name = "dezirclip"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true, optional = true }
windows-future = { workspace = true, optional = true }
windows-version = { workspace = true, optional = true }
winreg.workspace = true
webview2-com = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
gtk = { version = "=0.18.2", optional = true }
libc = { workspace = true }
x11rb = { workspace = true }
x11-clipboard = { workspace = true, optional = true }
ksni = { workspace = true, optional = true }
