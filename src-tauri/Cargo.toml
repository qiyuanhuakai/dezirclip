[package]
name = "dezirclip"
version.workspace = true
description = "A local clipboard workspace"
authors.workspace = true
edition.workspace = true
default-run = "dezirclip"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop"]
desktop = [
    "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state",
    "dep:window-vibrancy", "dep:tokio", "dep:machine-uid",
    "dep:dotenvy", "dep:qrcode2", "dep:xcap", "dep:font-kit",
    "dep:windows-core", "dep:windows-future", "dep:windows-version",
    "dep:winreg", "dep:webview2-com", "dep:x11-clipboard", "dep:ksni",
]
portable = ["dzc-core/portable", "dzc-platform/portable"]

[build-dependencies]
tauri-build = { workspace = true, optional = true }
serde_json = { workspace = true }

[dependencies]
dzc-core = { workspace = true, features = ["legacy-bridge"] }
dzc-platform.workspace = true
tauri = { workspace = true, optional = true }
tauri-plugin-opener = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
cssparser = { workspace = true }
base64 = { workspace = true }
rusqlite = { workspace = true }

arboard = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tauri-plugin-global-shortcut = { workspace = true, optional = true }
window-vibrancy = { workspace = true, optional = true }

regex = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
tauri-plugin-single-instance = { workspace = true, optional = true }
tauri-plugin-window-state = { workspace = true, optional = true }
uuid = { workspace = true }
urlencoding = { workspace = true }
machine-uid = { workspace = true, optional = true }
sha2 = { workspace = true }
hex = { workspace = true }
dotenvy = { workspace = true, optional = true }

dirs = { workspace = true }
qrcode2 = { workspace = true, optional = true }
rand = { workspace = true }
xcap = { workspace = true, optional = true }
zeroize = { workspace = true }
font-kit = { workspace = true, optional = true }
clap = { workspace = true }
ctrlc = { workspace = true }

[[bin]]
name = "dzc"
path = "src/bin/dzc.rs"

[[bin]]
name = "dezirclip"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-core = { workspace = true, optional = true }
windows-future = { workspace = true, optional = true }
windows-version = { workspace = true, optional = true }
winreg = { workspace = true, optional = true }
webview2-com = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
x11rb = { workspace = true }
x11-clipboard = { workspace = true, optional = true }
keyring = { workspace = true }
ksni = { workspace = true, optional = true }
