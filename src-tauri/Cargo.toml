[package]
name = "dezirclip"
version = "0.1.21-beta.1"
description = "A local clipboard workspace"
authors = ["qiyuanhuakai"]
edition = "2021"
default-run = "dezirclip"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["desktop"]
desktop = [
    "dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog", "dep:tauri-plugin-global-shortcut",
    "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state",
    "dep:window-vibrancy", "dep:tokio", "dep:machine-uid",
    "dep:dotenvy", "dep:qrcode2", "dep:xcap", "dep:font-kit",
    "dep:windows-core", "dep:windows-future", "dep:windows-version",
    "dep:winreg", "dep:webview2-com", "dep:x11-clipboard", "dep:ksni",
    "dep:tauri-plugin-updater",
    "dep:reqwest", "dep:rustls",
]
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }
serde_json = "1"

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "protocol-asset"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-updater = { version = "~2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
cssparser = "0.37"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }

arboard = "3"
argon2 = "0.5"
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
tokio = { version = "1", features = ["time", "sync"], optional = true }
tauri-plugin-dialog = { version = "2.7", optional = true }
tauri-plugin-global-shortcut = { version = "2.3.1", optional = true }
window-vibrancy = { version = "0.7.1", optional = true }

regex = "1.12.2"
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "crossterm_0_29"] }
unicode-width = { version = "0.2", default-features = false }
unicode-segmentation = "1.13.3"
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
machine-uid = { version = "0.5", optional = true }
sha2 = "0.10"
hex = "0.4"
dotenvy = { version = "0.15", optional = true }

dirs = "5.0"
qrcode2 = { version = "0.18", optional = true }
rand = "0.8"
xcap = { version = "0.9.6", optional = true }
zeroize = "1"
font-kit = { version = "0.14", optional = true }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"

[[bin]]
name = "dzc"
path = "src/bin/dzc.rs"

[[bin]]
name = "dezirclip"
path = "src/main.rs"
required-features = ["desktop"]

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Console", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Controls", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_UI_Accessibility", "Win32_UI_Input_Ime", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Media_Ocr", "Storage_Streams", "Globalization", "Graphics_Imaging"] }
windows-core = { version = "0.62", optional = true }
windows-future = { version = "0.3", optional = true }
windows-version = { version = "0.1.1", optional = true }
winreg = { version = "0.55.0", optional = true }
webview2-com = { version = "0.39.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
x11rb = { version = "0.13", features = ["xtest", "xfixes", "allow-unsafe-code"] }
x11-clipboard = { version = "0.9", optional = true }
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
ksni = { version = "0.3", features = ["blocking"], optional = true }

# ============ Release 体积优化 ============
[profile.release]
# 启用 LTO (Link Time Optimization) - 可减少约 10-20% 体积
lto = true
# 使用单个 codegen unit，更好的优化但编译更慢
codegen-units = 1
# 优化级别：s = 优化大小，z = 更激进的大小优化
opt-level = "s"
# 移除符号表和调试信息
strip = true
# 启用 panic = abort 减少 unwinding 代码
panic = "abort"
